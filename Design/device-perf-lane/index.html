<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Device Perf Lane · decode_csa_test</title>
  <style>
    /* Monochrome surfaces. Red is reserved for warning signals; all other
       emphasis uses the neutral value scale. */
    :root{
      color-scheme:dark;
      --bg:#111111;--surface:#181818;--raised:#202020;
      --text:#e8e8e8;--text-2:#b0b0b0;--text-3:#8a8a8a;--text-4:#6a6a6a;
      --divider:#383838;--boundary:#858585;
      --accent:#fd5644;
      --selection:#f0f0f0;
      --aic:#8e8e8e;--aiv:#606060;   /* value, not hue: rows are already grouped by type */

      --font:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      --mono:"SFMono-Regular",Consolas,"Cascadia Code","Liberation Mono",monospace;
      --t-focus:clamp(22px,calc(18px + 1.2vw),34px);
      --t-title:clamp(16px,calc(14px + .42vw),22px);
      --t-value:clamp(14px,calc(13px + .16vw),16px);
      --t-label:clamp(12px,calc(11px + .16vw),14px);
      --t-micro:clamp(12px,calc(11px + .12vw),13px);
      --s1:4px;--s2:8px;--s3:12px;--s4:20px;--s5:32px;--s6:48px;
      --inset:clamp(16px,3vw,40px);
      --ui-fill:rgb(26 26 26 / 72%);--ui-border:rgb(255 255 255 / 18%);
      --ease:cubic-bezier(.2,.7,.2,1);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;height:100%;background:var(--bg);color:var(--text);
      font-family:var(--font);font-size:var(--t-value);-webkit-font-smoothing:antialiased}
    body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
    button,select{font:inherit;color:inherit}
    .sp{flex:1}
    h1,h2,h3{margin:0;font-weight:500}

    /* ---- top bar ---- */
    .top{flex:none;display:flex;align-items:center;gap:clamp(8px,1vw,16px);padding:var(--s3) var(--inset)}
    .top h1{font-size:var(--t-title);letter-spacing:-.01em}
    .top .run,.top .soc{min-width:0;color:var(--text-4);font:var(--t-micro)/1.2 var(--mono);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ctl{min-height:32px;padding:0 var(--s3);border:1px solid var(--ui-border);border-radius:999px;
      background:var(--ui-fill);backdrop-filter:blur(12px);color:var(--text-2);
      font:var(--t-label)/1.15 var(--mono);cursor:pointer;transition:color .16s var(--ease),border-color .16s var(--ease)}
    .ctl:hover{color:var(--text);border-color:rgb(255 255 255/38%)}
    .ctl.on{background:var(--selection);border-color:var(--selection);color:#111111}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chips .ctl{min-height:32px;padding:0 10px;font-size:var(--t-micro)}
    .metric-select{display:inline-flex;align-items:center;gap:6px;color:var(--text-4);font:var(--t-micro)/1 var(--mono)}
    .metric-select select{min-height:32px;padding:0 9px;font-size:var(--t-micro)}
    main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,22vw,360px);align-items:stretch;gap:clamp(16px,2vw,32px);
      padding:var(--s2) var(--inset) var(--s3);overflow:hidden}
    .main-column{min-width:0;min-height:0;display:flex;flex-direction:column}
    .trace-pair{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;gap:var(--s2)}
    .view-tag{display:inline-flex;align-items:center;padding:3px 7px;border:1px solid var(--divider);
      border-radius:999px;color:var(--text-4);font:var(--t-micro)/1.2 var(--mono);white-space:nowrap}
    .analysis-panel{align-self:stretch;min-height:0;overflow:auto;
      padding-left:var(--s4);border-left:1px solid var(--divider);scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
    .analysis-panel .sec{gap:var(--s3)}
    .analysis-panel .sec-h{display:block}
    .analysis-panel .sec-h h2{font-size:var(--t-title)}
    .analysis-panel .sec-h p{margin-top:var(--s2);font:var(--t-micro)/1.7 var(--mono);overflow-wrap:anywhere}

    /* ---- section: no chrome, hierarchy from type + space ---- */
    .sec{display:flex;flex-direction:column;gap:var(--s4)}
    .trace-pair>.sec:first-child{flex:none;gap:var(--s2)}
    .trace-pair>.sec:last-child{flex:1;min-height:0;gap:var(--s2)}
    .sec-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
    .sec-h h2{font-size:var(--t-title);line-height:1.2;letter-spacing:-.01em}
    .sec-h p{margin:0;color:var(--text-3);font:var(--t-label)/1.6 var(--mono)}
    .sec-h p b{color:var(--text-2);font-weight:500}
    .lgnd{display:flex;gap:var(--s2) var(--s4);color:var(--text-4);font:var(--t-micro)/1.6 var(--mono);flex-wrap:wrap}
    .lgnd i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:0}
    .scroll{overflow-x:auto}
    .scroll,.dwrap{scrollbar-width:thin;scrollbar-color:#3a3a3a var(--surface)}
    .scroll::-webkit-scrollbar,.dwrap::-webkit-scrollbar{height:8px;width:8px}
    .scroll::-webkit-scrollbar-track,.dwrap::-webkit-scrollbar-track{background:var(--surface)}
    .scroll::-webkit-scrollbar-thumb,.dwrap::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}
    .scroll::-webkit-scrollbar-thumb:hover,.dwrap::-webkit-scrollbar-thumb:hover{background:#4d4d4d}
    .note{margin:0;padding:var(--s4) 0;color:var(--text-4);font:var(--t-label)/1.7 var(--mono)}
    svg{display:block;height:auto}
    #cp{min-width:1020px;width:100%}
    #dist{min-width:360px;width:100%}
    #lane{min-width:1240px;width:100%}
    #lane-wrap{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
    #lane-wrap.can-pan{cursor:grab}
    #lane-wrap.is-dragging{cursor:grabbing;user-select:none}
    .lane-axis-sticky{position:sticky;top:0;z-index:5;width:100%;min-width:1240px;background:var(--bg)}
    #lane-axis{display:block;width:100%;min-width:1240px;height:28px}
    .zoom-help{display:inline-flex;align-items:center;padding:0 4px;color:var(--text-4);font:var(--t-micro)/1.2 var(--mono);white-space:nowrap}
    .lane-toolbar{align-self:center;max-width:100%;width:max-content;flex:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
      min-height:52px;margin-top:var(--s1);padding:7px 9px 7px 18px;border:1px solid rgb(255 255 255 / 16%);
      border-radius:999px;background:rgb(34 34 34 / 82%);backdrop-filter:blur(18px);
      box-shadow:0 8px 28px rgb(0 0 0 / 24%)}
    .lane-toolbar-label{flex:none;color:var(--text);font:var(--t-value)/1.2 var(--font);white-space:nowrap}
    .lane-toolbar .chips{min-width:0;flex:0 1 auto;justify-content:flex-end}

    /* ---- four lenses: stat blocks on a rule, not cards ---- */
    .lens{display:flex;flex-direction:column;gap:var(--s2)}
    .lens-primary,.lens-secondary{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;background:var(--divider)}
    .lens button{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:var(--s2);
      text-align:left;padding:10px var(--s4);border:0;
      border-top:2px solid transparent;background:var(--bg);cursor:pointer;
      transition:background .16s var(--ease),border-color .16s var(--ease)}
    .lens-primary button{padding:11px var(--s3)}
    .lens-secondary button{padding:7px var(--s3);border-top-width:1px}
    .lens button:hover{background:var(--surface)}
    .lens button:focus-visible{outline:1px solid var(--boundary);outline-offset:-1px}
    .lens button.on{background:var(--surface);border-top-color:var(--selection)}
    .lens .l{color:var(--text-3);font:var(--t-label)/1.4 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lens .v{font:400 clamp(18px,calc(14px + .65vw),26px)/1.05 var(--mono);color:var(--text);letter-spacing:-.02em;white-space:nowrap}
    .lens-secondary .v{font:400 clamp(16px,calc(14px + .25vw),19px)/1.05 var(--mono)}
    .lens button.on .v{color:var(--text)}
    .lens .s{grid-column:1/-1;margin-top:5px;color:var(--text-4);font:var(--t-micro)/1.35 var(--mono);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hint{margin:0;max-width:78ch;color:var(--text-2);font:var(--t-label)/1.75 var(--font)}
    .analysis-panel .hint{padding:var(--s3);background:var(--surface);border-left:2px solid var(--divider);font-size:var(--t-micro)}

    /* ---- selected-task side panel ---- */
    .task-drawer{position:fixed;z-index:20;top:calc(52px + var(--s2));right:var(--inset);bottom:var(--s3);
      width:min(clamp(320px,24vw,420px),calc(100vw - var(--inset) - var(--inset)));min-height:0;display:flex;flex-direction:column;
      padding:var(--s3) var(--s4) var(--s4);overflow:hidden;visibility:hidden;pointer-events:none;
      border:1px solid var(--divider);border-radius:12px;background:#191919;
      box-shadow:0 16px 48px rgb(0 0 0 / 42%);transform:translateX(calc(100% + var(--inset)));
      transition:transform .24s var(--ease),visibility .24s}
    .task-drawer.open{transform:translateX(0);visibility:visible;pointer-events:auto}
    .drawer-head{flex:none;display:flex;align-items:center;gap:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--divider)}
    .drawer-head h2{flex:none;font-size:var(--t-value);color:var(--text-2);font-weight:500;white-space:nowrap}
    .drawer-head p{flex:1 1 120px;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-4);font:var(--t-micro) var(--mono)}
    .drawer-head .sp{display:none}
    .drawer-close{width:28px;height:28px;padding:0;border:1px solid var(--divider);border-radius:6px;background:transparent;color:var(--text-2);cursor:pointer}
    .drawer-content{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:var(--s4);padding-top:var(--s3);overflow:auto}
    .drawer-content .sub{min-width:0;gap:var(--s2)}
    .drawer-content .sub h3{font-size:var(--t-label);color:var(--text-4)}
    #dist{max-height:132px}
    .sub{display:flex;flex-direction:column;gap:var(--s3)}
    .sub h3{font-size:var(--t-value);color:var(--text-2)}
    .kv{display:grid;grid-template-columns:clamp(60px,5vw,76px) minmax(0,1fr);gap:var(--s2) var(--s3);margin:0;
      font:var(--t-label)/1.65 var(--mono)}
    .kv dt{color:var(--text-4)}
    .kv dd{margin:0;color:var(--text-2);overflow-wrap:anywhere}
    .kv dd b{color:var(--text);font-weight:500}
    .hot{color:var(--accent)}

    details.caveat{border-top:1px solid var(--divider);padding-top:var(--s3)}
    details.caveat summary{cursor:pointer;color:var(--text-4);font:var(--t-label) var(--mono);list-style:none}
    details.caveat summary::-webkit-details-marker{display:none}
    details.caveat summary:before{content:"+ "}
    details.caveat[open] summary:before{content:"− "}
    details.caveat ol{margin:var(--s3) 0 0;padding-left:var(--s4);max-width:92ch;
      color:var(--text-4);font-size:var(--t-label);line-height:1.85}

    @media(max-width:900px){
      main{grid-template-columns:minmax(0,1fr) 260px;gap:var(--s3);padding-left:16px;padding-right:16px}
      .analysis-panel{padding-left:var(--s3)}
      .top .run{max-width:38vw}
      .top .soc{display:none}
      .lane-toolbar{border-radius:18px;align-items:flex-start;flex-direction:column;padding:10px 12px}
      .lane-toolbar .chips{width:100%;justify-content:flex-start}
    }
    @media(max-width:680px){
      .top{gap:var(--s2)}
      main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:var(--s2)}
      .analysis-panel{grid-row:2;max-height:24dvh;padding:var(--s2) 0 0;border-left:0;border-top:1px solid var(--divider)}
      .analysis-panel .lens{gap:var(--s1)}
      .analysis-panel .lens-primary,.analysis-panel .lens-secondary{grid-template-columns:repeat(4,minmax(0,1fr))}
      .analysis-panel .lens button,.analysis-panel .lens-primary button,.analysis-panel .lens-secondary button{padding:5px 7px}
      .analysis-panel .lens .v{font-size:clamp(18px,5vw,22px)}
      .analysis-panel .hint{display:none}
      .task-drawer{top:56px;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));padding:var(--s3)}
      .drawer-content{gap:var(--s3)}
    }
    @media(max-width:620px){
      .top .run,.top .soc{display:none}
      .top .sp{display:none}
      .top #rank{max-width:42vw}
      .analysis-panel .lens-primary,.analysis-panel .lens-secondary{grid-template-columns:repeat(2,minmax(0,1fr))}
      :root{--t-focus:24px;--t-title:16px;--t-value:14px;--t-label:12px;--t-micro:12px}
    }
    @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="top">
    <h1>Device Perf Lane</h1>
    <span class="run" id="run">—</span>
    <span class="sp"></span>
    <select id="rank" class="ctl" aria-label="选择 rank"></select>
    <span class="soc" id="soc">—</span>
  </header>

  <main>
    <div class="main-column">
    <div class="trace-pair">
    <section class="sec">
      <div class="sec-h">
        <h2>关键路径</h2><span class="view-tag">依赖顺序</span><p id="cp-sub">—</p><span class="sp"></span>
        <div class="lgnd">
          <span><i style="background:var(--accent)"></i>单块任务 · 纯等待</span>
          <span><i style="background:var(--aic)"></i>落到核上的计算</span>
          <span><i style="background:var(--selection)"></i>当前选中</span>
        </div>
      </div>
      <div class="scroll"><svg id="cp" role="img" aria-label="关键路径上各任务的实测跨度"></svg></div>
    </section>

    <section class="sec">
      <div class="scroll" id="lane-wrap" title="Ctrl + 滚轮缩放；缩放后可左右拖动平移；普通滚轮滚动泳道">
        <div class="lane-axis-sticky"><svg id="lane-axis" aria-label="设备时间轴"></svg></div>
        <svg id="lane" role="img" aria-label="包含全部提交的设备任务时间泳道；泳道过高时可在此区域滚动"></svg>
      </div>
      <div class="lgnd" id="lane-lgnd"></div>
      <div class="lane-toolbar" role="toolbar" aria-label="设备泳道视图与叠加控制">
        <span class="lane-toolbar-label">泳道视图</span>
        <div class="chips" id="lane-ovl"></div>
      </div>
    </section>
    </div>

    </div>
    <aside class="analysis-panel" aria-label="性能分析侧面板">
      <section class="sec">
        <div class="sec-h"><h2>性能分析</h2><p id="sum">加载中…</p></div>
        <div class="lens" id="lens"></div>
        <p class="hint" id="hint"></p>
        <details class="caveat">
          <summary>口径与限制</summary>
          <ol id="cav"></ol>
        </details>
      </section>
    </aside>
  </main>

  <section class="task-drawer" id="task-drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawer-title">任务分析</h2><p id="drawer-sub">点击泳道中的任务查看耗时分布与执行信息</p>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="关闭任务分析面板">×</button>
    </div>
    <div class="drawer-content">
      <div class="sub">
        <h3>块耗时分布</h3>
        <div class="scroll" id="dist-wrap"><svg id="dist" role="img" aria-label="选中任务每个块的计算耗时"></svg></div>
        <p class="note" id="dist-note" hidden></p>
        <dl class="kv" id="dist-kv"></dl>
      </div>
      <div class="sub">
        <h3>选中任务</h3>
        <dl class="kv" id="detail"></dl>
      </div>
    </div>
  </section>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SVG = "http://www.w3.org/2000/svg";
const el = (n, a = {}) => { const e = document.createElementNS(SVG, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
const ms = (us) => (us / 1000).toFixed(us >= 1000 ? 2 : 3);
const mib = (b) => (b / 1024 / 1024).toFixed(b > 1024 * 1024 ? 0 : 1);

// Red marks warning signals; candidates and selection use the neutral scale.
// Core type is a tint, not a hue.
const C = { accent: "#fd5644", accentDim: "#7e3129", candidate: "#a8a8a8", sel: "#f0f0f0",
            block: "#565656", AIC: "#8e8e8e", AIV: "#606060",
            plain: "#3a3a3a", idle: "#232323", grid: "#262626", axis: "#6a6a6a", label: "#7a7a7a" };

let D, R, me = null, lens = "wait", laneAll = true, laneView = "task", laneColor = "none", laneRange = null, taskLayer = "none";
let laneZoomRaf = 0;
const ovl = { ribbon: true, bands: true, marks: true };
function laneLeft() { return 96; }

const LENS = {
  wait: { label: "关键路径上的等待", hint: "单块任务串在关键路径上，零计算，纯等 rank 间数据或上游同步 —— 这段时间加核也不会变快。" },
  tail: { label: "尾块浪费", hint: "（最慢块 − 平均块）× 块数，是所有块同时启动时的核时损失上界；离散大而 p90 贴近中位 = 个别块掉队。" },
  setup: { label: "启动开销", hint: "launch / setup 成本占比高的提交，通常是块多、单块短的小 kernel，融合可能比调优单块更有效。" },
  waves: { label: "并行波次", hint: "块数超过可用物理核数就要分多轮派发；只有落在关键路径上的波次才影响端到端。" },
};

function candidatesFor(id) {
  const byTask = (taskId) => R.launches.find((l) => l.taskId === String(taskId));
  if (id === "wait") {
    const byId = new Map(R.launches.map((l) => [l.id, l]));
    return R.criticalPath.filter((p) => p.blockNum === 1 && p.spanUs > 0)
      .map((p) => (p.ids?.length ? byId.get(p.ids[0]) : byTask(p.taskId))).filter(Boolean)
      .sort((a, b) => b.spanUs - a.spanUs).slice(0, 5);
  }
  if (id === "tail") return R.launches.filter((l) => l.tailWasteUs > 0).slice().sort((a, b) => b.tailWasteUs - a.tailWasteUs).slice(0, 5);
  if (id === "setup") return R.launches.slice().sort((a, b) => (b.setupUs / (b.setupUs + b.computeUs || 1)) - (a.setupUs / (a.setupUs + a.computeUs || 1))).slice(0, 5);
  if (id === "waves") return R.launches.slice().sort((a, b) => b.waves - a.waves || b.spanUs - a.spanUs).slice(0, 5);
  return [];
}
const lensMetric = (x) => lens === "tail" ? `${ms(x.tailWasteUs)} ms 尾块`
  : lens === "setup" ? `${(x.setupUs / (x.setupUs + x.computeUs || 1) * 100).toFixed(0)}% setup`
  : lens === "waves" ? `${x.waves} 波` : `${ms(x.spanUs)} ms 跨度`;

// ---------- run summary + lenses ----------
function header() {
  const k = R.kpi;
  $("sum").innerHTML = `窗口 <b>${ms(k.windowUs)} ms</b> · ${k.totalTasks} 次提交，关键路径上 ${k.criticalPathTasks} 个`
    + ` · ${k.totalCores} 核占用 <b>${(k.occupancy * 100).toFixed(0)}%</b> · 声明搬运 <b>${mib(k.bytesTotal)} MiB</b>`;
  const maxWaves = Math.max(...R.launches.map((l) => l.waves));
  const primary = [
    { id: "wait", v: `${(k.waitOnPathShare * 100).toFixed(0)}%`, s: `${ms(k.waitOnPathUs)} / 路径 ${ms(k.criticalPathUs)} ms` },
    { id: "setup", v: `${(k.setupShare * 100).toFixed(1)}%`, s: `${ms(k.setupUs)} / 算 ${ms(k.computeUs)} ms` },
  ];
  const secondary = [
    { id: "tail", v: `${ms(k.tailWasteUs)} ms`, s: `核时上界 · 算时的 ${(k.tailWasteRatio * 100).toFixed(0)}%` },
    { id: "waves", v: `${maxWaves} 波`, s: `${R.launches.filter((l) => l.waves > 1).length} 个提交 >1 波` },
  ];
  const renderLens = (cards) => cards.map((c) => `<button type="button" data-lens="${c.id}" aria-pressed="${c.id === lens}" class="${c.id === lens ? "on" : ""}">`
    + `<div class="l">${esc(LENS[c.id].label)}</div><div class="v">${esc(c.v)}</div><div class="s">${esc(c.s)}</div></button>`).join("");
  $("lens").innerHTML = `<div class="lens-primary">${renderLens(primary)}</div><div class="lens-secondary">${renderLens(secondary)}</div>`;
  $("hint").textContent = LENS[lens].hint;
}

// ---------- critical path ----------
function criticalPath() {
  const svg = $("cp"); svg.textContent = "";
  const total = R.criticalPath.reduce((a, p) => a + p.spanUs, 0) || 1;
  const W = Math.max(1020, Math.floor(svg.parentElement.clientWidth || 1020));
  const H = 72, GAP = 3, TOP = 6, BAR = 30;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  let x = 0;
  R.criticalPath.forEach((p) => {
    const w = Math.max(1.2, (p.spanUs / total) * (W - R.criticalPath.length * GAP));
    const isWait = p.blockNum === 1 || !p.onCore;
    const isSel = me && p.ids.includes(me);
    const g = el("g", { class: "cp-seg", "data-t": p.taskId, style: "cursor:pointer" });
    g.append(el("rect", { x, y: TOP, width: w, height: BAR,
      fill: isSel ? C.sel : isWait ? C.accent : C.AIC, opacity: isWait || isSel ? 1 : .55 }));
    if (w > 44) {
      const t = el("text", { x: x + 5, y: TOP + 19, fill: "#111111", "font-family": "var(--mono)", "font-size": 12 });
      t.textContent = `${ms(p.spanUs)}ms`; g.append(t);
      const n = el("text", { x: x + 0, y: TOP + BAR + 16, fill: isWait ? C.accent : C.label,
        "font-family": "var(--mono)", "font-size": 12 });
      n.textContent = p.name.length > Math.floor(w / 7.2) ? `${p.name.slice(0, Math.floor(w / 7.2))}…` : p.name;
      g.append(n);
    }
    const ttl = el("title", {});
    ttl.textContent = `${p.name}\n跨度 ${ms(p.spanUs)} ms · 算 ${ms(p.computeUs)} ms · ${p.blockNum ?? "—"} 块`;
    g.append(ttl); svg.append(g);
    x += w + GAP;
  });
  svg.onclick = (e) => { const g = e.target.closest && e.target.closest(".cp-seg"); if (g) selectTask(g.getAttribute("data-t")); };
  const waitN = R.criticalPath.filter((p) => p.blockNum === 1 && p.spanUs > 0).length;
  $("cp-sub").innerHTML = `<b>${ms(R.kpi.criticalPathUs)} ms</b> / ${R.criticalPath.length} 个任务，其中 ${waitN} 个是纯等待`;
}

// ---------- device lane ----------
// Two layers. The base is 4038 blocks drawn as flat, quiet texture — it answers
// "what is the shape of this run" and nothing else. Everything that asks for
// attention is computed structure drawn on top of it.
function concStats() {
  if (R._conc) return R._conc;
  const ev = [];
  for (const l of R.launches) for (const b of (l.blocks.items || [])) { ev.push([b.startUs, 1]); ev.push([b.endUs, -1]); }
  ev.sort((a, b) => a[0] - b[0] || a[1] - b[1]);   // ends before starts at a shared instant
  const segs = []; let n = 0, t = ev.length ? ev[0][0] : 0;
  for (let i = 0; i < ev.length;) {
    const tt = ev[i][0];
    if (tt > t) { segs.push([t, tt, n]); t = tt; }
    while (i < ev.length && ev[i][0] === tt) { n += ev[i][1]; i++; }
  }
  const win = R.kpi.windowUs, minRun = Math.max(8, win / 500);
  const merge = (pred, min) => {
    const out = []; let cur = null;
    for (const s of segs) {
      if (pred(s[2])) {
        if (cur && Math.abs(cur.t1 - s[0]) < 1e-9) cur.t1 = s[1];
        else { cur = { t0: s[0], t1: s[1] }; out.push(cur); }
      } else cur = null;
    }
    return out.filter((r) => r.t1 - r.t0 >= min).sort((a, b) => (b.t1 - b.t0) - (a.t1 - a.t0));
  };
  const span = (pred) => segs.filter((s) => pred(s[2])).reduce((a, s) => a + (s[1] - s[0]), 0);
  R._conc = {
    segs,
    gaps: merge((c) => c === 0, minRun),                 // nothing running anywhere
    serial: merge((c) => c >= 1 && c <= 2, minRun * 2),  // one or two cores carrying the device
    gapUs: span((c) => c === 0), lowUs: span((c) => c <= 2),
    peak: segs.length ? Math.max(...segs.map((s) => s[2])) : 0,
  };
  return R._conc;
}

// Time-range landmarks. The first is fixed, the second follows the active lens,
// so the overlay always points at whatever the page is currently about.
function landmarks() {
  const out = [];
  const cs = concStats();
  const longest = R.launches.reduce((a, b) => (b.spanUs > a.spanUs ? b : a));
  const top = candidatesFor(lens)[0];
  // the lens pick and the longest task are often the same launch — say so once
  const sameAsLongest = top && top.id === longest.id && lens !== "tail";
  out.push({
    label: sameAsLongest ? `最长 Task，也是${LENS[lens].label} Top1 · ${longest.leaf}` : `最长 Task · ${longest.leaf}`,
    note: `${ms(longest.spanUs)} ms 跨度`,
    t0: longest.startUs, t1: longest.endUs, hot: sameAsLongest && lens === "wait", id: longest.id,
  });
  if (cs.serial.length) {
    const r = cs.serial[0];
    out.push({ label: `最长串行段 · 全机只有 ≤2 核在跑`, note: `${ms(r.t1 - r.t0)} ms，其余 ${R.kpi.totalCores - 2} 核空转`,
               t0: r.t0, t1: r.t1, hot: false, id: null });
  }
  if (top && !sameAsLongest) {
    if (lens === "tail") {
      const ends = (top.blocks.items || []).map((b) => b.endUs).sort((a, b) => a - b);
      if (ends.length > 1) {
        const t0 = ends[Math.floor(ends.length / 2)], t1 = ends[ends.length - 1];
        out.push({ label: `尾块拖尾 · ${top.leaf}`, note: `一半块结束后又跑了 ${ms(t1 - t0)} ms`,
                   t0, t1, hot: false, id: top.id });
      }
    } else {
      out.push({ label: `${LENS[lens].label} Top1 · ${top.leaf}`, note: lensMetric(top),
                 t0: top.startUs, t1: top.endUs, hot: lens === "wait", id: top.id });
    }
  }
  return out;
}

// Greedy interval packing per core type: a task goes in the first track whose
// last task has already finished. Track count = peak simultaneous tasks.
function packTasks() {
  if (R._packed) return R._packed;
  const lane = new Map(), depth = {};
  for (const ct of ["AIC", "AIV"]) {
    const ls = R.launches.filter((l) => l.ct === ct)
      .sort((a, b) => a.startUs - b.startUs || b.spanUs - a.spanUs);
    const ends = [];
    for (const l of ls) {
      let i = ends.findIndex((e) => e <= l.startUs + 1e-9);
      if (i < 0) { ends.push(l.endUs); i = ends.length - 1; } else ends[i] = l.endUs;
      lane.set(l.id, i);
    }
    depth[ct] = Math.max(1, ends.length);
  }
  R._packed = { lane, depth };
  return R._packed;
}

const TASK_LAYERS = [
  ["none", "关闭"], ["tail", "拖尾任务"], ["parallel", "Task 并行度不足"],
  ["imbalance", "块负载不均"], ["underfill", "尾波空置"], ["fragmented", "离散小 Task"],
  ["setup", "Setup 占比高"], ["bubble", "依赖间隔"],
];
function analyzeTaskLayer(mode) {
  const tasks = R.launches, hits = new Set(), gaps = [];
  const sorted = (values) => values.slice().sort((a, b) => a - b);
  const quantile = (values, q) => {
    const a = sorted(values);
    return a.length ? a[Math.min(a.length - 1, Math.floor((a.length - 1) * q))] : 0;
  };
  const p50Span = quantile(tasks.map((l) => l.spanUs), .5);
  const p25Span = quantile(tasks.map((l) => l.spanUs), .25);
  const p25BlockCount = quantile(tasks.map((l) => l.blocks.n), .25);
  const p90End = quantile(tasks.map((l) => l.endUs), .9);
  const byTask = new Map(tasks.map((l) => [String(l.taskId), l]));
  const predEdges = new Map();
  if (mode === "bubble") R.edges.forEach((e) => {
    const key = String(e.succ);
    if (!predEdges.has(key)) predEdges.set(key, new Set());
    predEdges.get(key).add(String(e.pred));
  });

  for (const l of tasks) {
    const cores = l.ct === "AIC" ? R.kpi.aicCores : R.kpi.aivCores;
    const setupShare = l.setupUs / Math.max(1, l.computeUs + l.setupUs);
    const lastWave = cores ? l.blocks.n % cores : 0;
    let match = false;
    if (mode === "tail") match = l.endUs >= p90End && l.spanUs >= p50Span;
    if (mode === "parallel") match = l.blocks.n > 1 && l.spanUs >= p50Span
      && l.computeUs / Math.max(1, l.spanUs) < cores * .25 && setupShare < .5;
    if (mode === "imbalance") match = l.blocks.n >= 4 && l.blocks.spread >= 1.5
      && l.blocks.p90 / Math.max(1, l.blocks.p50) >= 1.4;
    if (mode === "underfill") match = l.waves > 1 && lastWave > 0
      && lastWave / Math.max(1, cores) < .5;
    if (mode === "fragmented") match = l.blocks.n <= Math.max(4, p25BlockCount) && l.spanUs <= p25Span;
    if (mode === "setup") match = setupShare >= .3 && l.setupUs > 1;
    if (mode === "bubble") {
      const ids = [...(predEdges.get(String(l.taskId)) || [])];
      const preds = ids.map((id) => byTask.get(id));
      if (preds.length && preds.every(Boolean)) {
        const ready = Math.max(...preds.map((p) => p.endUs));
        const gap = l.startUs - ready;
        if (gap > Math.max(3, l.blocks.p50 * 2)) {
          match = true;
          gaps.push({ task: l, t0: ready, t1: l.startUs, gap });
        }
      }
    }
    if (match) hits.add(l.id);
  }
  const labels = {
    tail: "结束时间靠后的长任务", parallel: "平均并行计算核数低于该类核的 25%",
    imbalance: "块耗时离散且 P90 明显高于中位数", underfill: "末波使用不足一半的该类型可用核",
    fragmented: "跨度和块数均处于当前 rank 的较低四分位", setup: "Setup 占计算与 Setup 总耗时的 30% 以上",
    bubble: "前驱结束到该任务开始之间存在可观测间隔（仅作线索）",
  };
  const byKernel = new Map();
  tasks.filter((l) => hits.has(l.id)).forEach((l) => {
    const kernel = l.leaf.replace(/_\d+$/, ""), key = `${l.ct} · ${kernel}`;
    if (!byKernel.has(key)) byKernel.set(key, { key, kernel, ct: l.ct, tasks: [] });
    byKernel.get(key).tasks.push(l);
  });
  const groups = [...byKernel.values()].map((group) => {
    group.tasks.sort((a, b) => a.startUs - b.startUs || b.endUs - a.endUs);
    group.totalSpan = group.tasks.reduce((sum, task) => sum + task.spanUs, 0);
    return group;
  }).sort((a, b) => b.tasks.length - a.tasks.length || b.totalSpan - a.totalSpan);
  return { hits, gaps, groups, label: labels[mode] || "", count: mode === "bubble" ? gaps.length : hits.size };
}

function renderLane() {
  const svg = $("lane"), axis = $("lane-axis"), LEFT = laneLeft(), RIGHT = 12, TOP = 10;
  $("lane-wrap").classList.toggle("can-pan", !!laneRange);
  const W = Math.max(1240, Math.floor($("lane-wrap").clientWidth || 1240));
  const byTask = laneView === "task";
  const taskAnalysis = !byTask && taskLayer !== "none"
    ? analyzeTaskLayer(taskLayer) : { hits: new Set(), gaps: [], groups: [], label: "", count: 0 };
  const taskPalette = ["#79b8ff", "#58c7ad", "#b7a0ff", "#dfbd69", "#70c5d8", "#b1cb72"];
  const taskColorById = new Map();
  taskAnalysis.groups.forEach((group, index) => group.tasks.forEach((task) => {
    taskColorById.set(task.id, index < taskPalette.length ? taskPalette[index] : "#a8a8a8");
  }));
  // Keep chart typography stable in CSS pixels: on wide screens the time axis
  // gains horizontal room instead of scaling the entire SVG and making rows taller.
  const labelScale = Math.max(1, (svg.clientWidth || W) / W);
  const taskLabelFont = 12 / labelScale;
  const taskLabelAdvance = 7.2 / labelScale;
  const coreRows = R.cores.slice().sort((a, b) => a.id - b.id);
  const pk = byTask ? packTasks() : null;
  // Task lanes need a little more vertical breathing room as the time axis

  const taskRow = Math.max(22, Math.min(30, Math.round(W / 72)));
  const ROW = byTask ? taskRow : 13;
  const GH = byTask ? 14 : 0;                       // room for a group caption line
  const rowCount = byTask ? pk.depth.AIC + pk.depth.AIV : coreRows.length;
  const innerW = W - LEFT - RIGHT, win = R.kpi.windowUs, cs = concStats();
  const viewStart = laneRange ? laneRange[0] : 0;
  const viewEnd = laneRange ? laneRange[1] : win;
  const viewWin = Math.max(1e-6, viewEnd - viewStart);
  const metricValue = (l) => laneColor === "setup" ? l.setupUs / (l.computeUs || 1) * 100 : l.tailWasteUs / 1000;
  const metricValues = laneColor === "none" ? [] : R.launches.map(metricValue).sort((a, b) => a - b);
  const metricCap = metricValues.length ? metricValues[Math.max(0, Math.ceil(metricValues.length * .9) - 1)] || 1 : 1;
  const metricColor = (l) => {
    if (laneColor === "none") return null;
    const t = Math.max(0, Math.min(1, metricValue(l) / metricCap));
    const from = 56, to = 208, v = Math.round(from + (to - from) * t);
    return `rgb(${v} ${v} ${v})`;
  };
  const marks = ovl.marks ? landmarks() : [];
  const RIB = ovl.ribbon ? 64 : 0, RIBGAP = ovl.ribbon ? 8 : 0, LMROW = 20, LM = marks.length * LMROW;
  const laneTop = TOP + RIB + RIBGAP;
  const laneH = rowCount * ROW + (byTask ? GH * 2 : 0);
  const lmTop = laneTop + laneH + 22;
  const H = lmTop + LM + 4;
  const cand = new Set(candidatesFor(lens).map((l) => l.id));
  const keep = (id) => laneAll || cand.has(id) || id === me || taskAnalysis.hits.has(id);
  svg.textContent = ""; svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const xOf = (us) => LEFT + ((us - viewStart) / viewWin) * innerW;
  const r1 = (v) => Math.round(v * 10) / 10;
  const txt = (o, s, parent = svg) => { const t = el("text", o); t.textContent = s; parent.append(t); return t; };
  const hit = (id, aria) => el("g", { class: "task-event", "data-id": id, tabindex: "0", role: "button",
    "aria-label": aria, style: "cursor:pointer" });
  axis.textContent = ""; axis.setAttribute("viewBox", `0 0 ${W} 28`); axis.setAttribute("width", W); axis.setAttribute("height", 28);
  axis.append(el("rect", { x: 0, y: 0, width: W, height: 28, fill: "#111111" }));
  axis.append(el("line", { x1: LEFT, x2: W - RIGHT, y1: 25, y2: 25, stroke: C.grid, "stroke-width": 1 }));
  const axisLabel = (us) => viewWin < 1000 ? `${Math.round(us)} μs`
    : `${(us / 1000).toFixed(viewWin < 10000 ? 3 : 2)} ms`;
  for (let t = 0; t <= 8; t++) {
    const x = LEFT + innerW * t / 8;
    axis.append(el("line", { x1: x, x2: x, y1: 20, y2: 27, stroke: C.grid, "stroke-width": 1 }));
    txt({ x, y: 15, fill: C.axis, "font-family": "var(--mono)", "font-size": 12,
      "text-anchor": t === 0 ? "start" : t === 8 ? "end" : "middle" }, axisLabel(viewStart + viewWin * t / 8), axis);
  }

  // 1. low-concurrency bands, full height so a dip in the ribbon and a hole in
  //    the lane read as one column of time
  if (ovl.bands) {
    const bandBot = laneTop + laneH;
    const band = (r, fill, stroke) => {
      const t0 = Math.max(viewStart, r.t0), t1 = Math.min(viewEnd, r.t1);
      if (t1 <= t0) return;
      const x = xOf(t0), w = Math.max(1, xOf(t1) - xOf(t0));
      svg.append(el("rect", { x, y: TOP, width: w, height: bandBot - TOP, fill }));
      svg.append(el("line", { x1: x, x2: x, y1: TOP, y2: bandBot, stroke, "stroke-width": 1 }));
      svg.append(el("line", { x1: x + w, x2: x + w, y1: TOP, y2: bandBot, stroke, "stroke-width": 1 }));
      if (w > 48) txt({ x: x + 3, y: bandBot + 13, fill: stroke, "font-family": "var(--mono)", "font-size": 12 }, `${ms(r.t1 - r.t0)} ms`);
    };
    cs.serial.slice(0, 10).forEach((r) => band(r, "rgb(255 255 255 / 5%)", "#4a4a4a"));
    cs.gaps.slice(0, 10).forEach((r) => band(r, "rgb(253 86 68 / 11%)", C.accentDim));
  }
  if (taskLayer === "bubble" && taskAnalysis.gaps.length) {
    const regions = taskAnalysis.gaps.map((g) => [Math.max(viewStart, g.t0), Math.min(viewEnd, g.t1)])
      .filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
    const merged = [];
    regions.forEach(([a, b]) => {
      const last = merged[merged.length - 1];
      if (last && a <= last[1]) last[1] = Math.max(last[1], b); else merged.push([a, b]);
    });
    merged.forEach(([a, b]) => {
      const x = xOf(a), w = xOf(b) - x;
      svg.append(el("rect", { x, y: TOP, width: w, height: laneTop + laneH - TOP,
        fill: "rgb(253 86 68 / 6%)", "pointer-events": "none" }));
      svg.append(el("line", { x1: x, x2: x, y1: TOP, y2: laneTop + laneH, stroke: C.accent, "stroke-opacity": .45, "stroke-width": 1 }));
      svg.append(el("line", { x1: x + w, x2: x + w, y1: TOP, y2: laneTop + laneH, stroke: C.accent, "stroke-opacity": .45, "stroke-width": 1 }));
    });
  }
  if (ovl.ribbon) {
    const base = TOP + RIB, refY = base - RIB * .25;
    svg.append(el("rect", { x: LEFT, y: refY, width: innerW, height: base - refY, fill: "rgb(255 255 255 / 4%)" }));
  }

  // 2. time grid
  for (let t = 0; t <= 8; t++) {
    const x = LEFT + innerW * t / 8;
    svg.append(el("line", { x1: x, x2: x, y1: TOP, y2: laneTop + laneH, stroke: C.grid, "stroke-width": 1 }));
  }

  // 3. concurrency ribbon
  if (ovl.ribbon) {
    const NB = 400, bw = viewWin / NB, base = TOP + RIB, buck = new Float64Array(NB);
    for (const [a, b, c] of cs.segs) {
      if (c <= 0) continue;
      const aView = Math.max(a, viewStart), bView = Math.min(b, viewEnd);
      if (bView <= aView) continue;
      const i0 = Math.max(0, Math.floor((aView - viewStart) / bw));
      const i1 = Math.min(NB - 1, Math.ceil((bView - viewStart) / bw) - 1);

    let d = `M ${LEFT} ${base}`, topLine = "", lowLine = "";
    for (let i = 0; i < NB; i++) {

      const y = r1(base - Math.min(1, cores / total) * RIB);
      const x0 = r1(LEFT + innerW * i / NB), x1 = r1(LEFT + innerW * (i + 1) / NB);
      d += ` L ${x0} ${y} L ${x1} ${y}`;
      topLine += `M ${x0} ${y} H ${x1}`;
      if (cores / total <= .25) lowLine += `M ${x0} ${y} H ${x1}`;
    }
    d += ` L ${LEFT + innerW} ${base} Z`;
    svg.append(el("path", { d, fill: "#383838" }));
    svg.append(el("path", { d: topLine, fill: "none", stroke: "#858585", "stroke-width": 1.1 }));
    if (lowLine) svg.append(el("path", { d: lowLine, fill: "none", stroke: "#c4c4c4", "stroke-width": 2, "stroke-linecap": "round" }));
    const refY = base - RIB * .25;
    svg.append(el("line", { x1: LEFT, x2: W - RIGHT, y1: refY, y2: refY, stroke: "#707070", "stroke-width": 1, "stroke-dasharray": "4 4" }));
    svg.append(el("line", { x1: LEFT, x2: W - RIGHT, y1: base, y2: base, stroke: C.grid, "stroke-width": 1 }));

    txt({ x: 0, y: TOP + 27, fill: C.axis, "font-family": "var(--mono)", "font-size": 12 }, `满格 ${R.kpi.totalCores} 核`);
    txt({ x: 0, y: refY + 5, fill: C.axis, "font-family": "var(--mono)", "font-size": 12 }, `25% · ${Math.round(total * .25)} 核`);
  }

  if (byTask) {
    // ---- collapsed: one bar per submission, packed into tracks ----

    let y0 = laneTop;
    for (const ct of ["AIC", "AIV"]) {
      const depth = pk.depth[ct], nCores = ct === "AIC" ? R.kpi.aicCores : R.kpi.aivCores;
      txt({ x: 0, y: y0 + 14, fill: C.label, "font-family": "var(--mono)", "font-size": 12 },
        `${ct} ×${nCores} · ${depth} 轨`);

        g.append(el("rect", { x: x - Math.max(0, (3 - w) / 2), y: top + i * ROW, width: Math.max(3, w), height: ROW, fill: "transparent" }));

            "paint-order": "stroke", stroke: "#111111", "stroke-width": .35, "stroke-linejoin": "round" });
          const room = Math.floor(w / taskLabelAdvance);

        }

        ttl.textContent = `${l.leaf} · ${l.ct} · Task ${l.taskId}
${ms(l.startUs)} – ${ms(l.endUs)} ms（跨度 ${ms(l.spanUs)} ms）
${l.blocks.n} 块 / 占用 ${l.coresUsed} 个核（共 ${nCores}）/ ${l.waves} 波
算 ${ms(l.computeUs)} ms · setup ${ms(l.setupUs)} ms · setup/compute ${(l.setupUs / (l.computeUs || 1) * 100).toFixed(1)}% · 尾块核时上界 ${ms(l.tailWasteUs)} ms`;
        g.append(ttl); svg.append(g);

  } else {

      .filter((b) => keep(b.launch.id));
    const hotRows = new Set(show.filter((b) => laneColor === "none" && cand.has(b.launch.id)).map((b) => b.core));

    coreRows.forEach((c, i) => {

      g.append(el("rect", { x, y, width: w, height: ROW - 4,
        fill: isSel ? C.sel : taskLayerColor || metricColor(b.launch) || (isCand ? C.candidate : C.block),
        opacity: taskLayer !== "none" && !taskAnalysis.hits.has(b.launch.id) && !isSel ? .16
          : isSel || isCand || laneColor !== "none" ? 1 : .85 }));
      g.append(el("rect", { x: x - (hitW - w) / 2, y: y - 2, width: hitW, height: ROW, fill: "transparent" }));
      const ttl = el("title", {});
      ttl.textContent = `${b.launch.leaf} · ${b.launch.ct} · core ${b.core}
Task ${b.launch.taskId} · ${b.startUs.toFixed(1)}–${b.endUs.toFixed(1)} μs
算 ${b.computeUs.toFixed(1)} μs · setup ${b.setupUs.toFixed(1)} μs · Task setup/compute ${(b.launch.setupUs / (b.launch.computeUs || 1) * 100).toFixed(1)}% · 尾块核时上界 ${ms(b.launch.tailWasteUs)} ms`
        + (taskAnalysis.hits.has(b.launch.id) ? `\nTask 图层：${taskAnalysis.label}` : "");
      g.append(ttl); svg.append(g);
    });
  }

  // 4. landmarks
  const textW = (str) => [...str].reduce((a, ch) => a + (ch.charCodeAt(0) > 255 ? 12 : 7.2), 0);
  marks.forEach((m, i) => {
    if (m.t1 < viewStart || m.t0 > viewEnd) return;
    const y = lmTop + i * LMROW + 13;
    const x0 = xOf(Math.max(viewStart, m.t0)), x1 = Math.max(x0 + 2, xOf(Math.min(viewEnd, m.t1)));
    const col = m.hot ? C.accent : "#6f6f6f";
    const g = m.id ? hit(m.id, m.label) : el("g", {});
    g.append(el("line", { x1: x0, x2: x1, y1: y, y2: y, stroke: col, "stroke-width": 1.4 }));
    [x0, x1].forEach((x) => g.append(el("line", { x1: x, x2: x, y1: y - 3.5, y2: y + 3.5, stroke: col, "stroke-width": 1.4 })));
    const label = `${m.label} · ${m.note}`;
    const t = el("text", { x: Math.max(0, Math.min(x0, W - textW(label) - 4)), y: y - 6,
      fill: col, "font-family": "var(--mono)", "font-size": 12 });
    t.textContent = label;
    g.append(t);
    const ttl = el("title", {}); ttl.textContent = `${m.label}\n${m.note}\n${ms(m.t0)} – ${ms(m.t1)} ms`;
    g.append(ttl); svg.append(g);
  });

  svg.onclick = (e) => { const g = e.target.closest && e.target.closest(".task-event"); if (g) select(g.getAttribute("data-id")); };
  svg.onkeydown = (e) => { const g = e.target.closest && e.target.closest(".task-event"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(g.getAttribute("data-id")); } };

  $("lane-ovl").innerHTML =
    [["task", "按 Task"], ["core", "按物理核"]]
      .map(([v, label]) => `<button type="button" class="ctl${laneView === v ? " on" : ""}" data-view="${v}" aria-pressed="${laneView === v}">${label}</button>`).join("")
    + `<span style="width:10px"></span>`
    + [["ribbon", "并行宽度"], ["bands", "低并行区"], ["marks", "地标"]]
      .map(([k, label]) => `<button type="button" class="ctl${ovl[k] ? " on" : ""}" data-ovl="${k}" aria-pressed="${!!ovl[k]}">${label}</button>`).join("")
    + `<button type="button" class="ctl${laneAll ? "" : " on"}" data-ovl="only" aria-pressed="${!laneAll}" title="只在泳道中显示当前分析视角的候选任务">仅显示候选</button>`
    + (!byTask ? `<label class="metric-select" title="按 Task 特征筛选并按 kernel 归组，规则是当前 trace 内的筛查线索">Task 分布<select id="task-layer" class="ctl" aria-label="Task 分布特征">`
      + TASK_LAYERS.map(([v, label]) => `<option value="${v}"${taskLayer === v ? " selected" : ""}>${label}</option>`).join("")
      + `</select></label>` : "")
    + (!byTask && taskLayer !== "none" ? `<span class="zoom-help" title="${esc(taskAnalysis.label)}">命中 ${taskAnalysis.count} 个 Task</span>` : "")
    + `<span class="zoom-help">Ctrl + 滚轮缩放 · 缩放后拖动平移</span>`
    + (laneRange ? `<button type="button" class="ctl" data-zoom-reset title="恢复完整时间范围">复位 ×${(win / viewWin).toFixed(1)}</button>` : "")
    + `<label class="metric-select">着色<select id="lane-color" class="ctl" aria-label="泳道数据着色方式">`
    + `<option value="none"${laneColor === "none" ? " selected" : ""}>候选任务</option>`
    + `<option value="setup"${laneColor === "setup" ? " selected" : ""}>setup 占比</option>`
    + `<option value="tail"${laneColor === "tail" ? " selected" : ""}>尾块浪费</option></select></label>`;
  const colorLegend = taskLayer !== "none"
    ? ""
    : laneColor === "none"
    ? `<span><i style="background:${C.candidate}"></i>当前视角候选</span>`
    : `<span><i style="width:36px;height:8px;background:linear-gradient(90deg,#383838,#d0d0d0)"></i>${laneColor === "setup" ? "setup / compute" : "尾块核时上界"} · 0 → ${laneColor === "setup" ? `${metricCap.toFixed(0)}%` : `${metricCap.toFixed(2)} ms`}+（P90 饱和）</span>`;
  const taskLayerLegend = !byTask && taskLayer !== "none"
    ? taskAnalysis.groups.slice(0, taskPalette.length).map((group, index) =>
      `<span title="${esc(group.key)}：${group.tasks.length} 个命中 Task"><i style="background:${taskPalette[index]}"></i>${esc(group.kernel)} · ${group.tasks.length}</span>`).join("")
      + (taskAnalysis.groups.length > taskPalette.length
        ? `<span title="其余 ${taskAnalysis.groups.length - taskPalette.length} 个 kernel 组"><i style="background:#a8a8a8"></i>其他 kernel · ${taskAnalysis.groups.slice(taskPalette.length).reduce((sum, group) => sum + group.tasks.length, 0)}</span>` : "")
      + `<span>同 kernel 同色 · 未命中任务淡化</span>`
    : "";
  $("lane-lgnd").innerHTML = [
    `<span><i style="background:${C.block}"></i>${byTask ? "一次提交" : "Task block（底层）"}</span>`,
    colorLegend,
    `<span><i style="background:${C.sel}"></i>当前选中</span>`,
    taskLayerLegend,
    ovl.ribbon ? `<span><i style="width:16px;height:2px;background:#c4c4c4"></i>并行宽度低于 25% 参考线</span>` : "",
    ovl.bands ? `<span><i style="background:#3d3d3d"></i>≤2 核在跑</span><span><i style="background:#4a2420"></i>真空窗（0 核）</span>` : "",
    byTask
      ? `<span>条宽 = Task 跨度 · <b style="color:var(--text-2)">条高 = 占用核数 ÷ 该类型可用核数</b> · 同轨的 Task 时间不重叠</span>`
      : `<span>每行 = 一个物理核 · 横轴 = 设备时间 · 悬停看耗时分解</span>`,
  ].join("");
}

// ---------- block distribution ----------
function distribution() {
  const svg = $("dist"); svg.textContent = "";
  const l = R.launches.find((x) => x.id === me);
  if (!l) return;
  const b = l.blocks, durs = b.durs;
  const only1 = b.n === 1;
  $("dist-wrap").hidden = only1;
  $("dist-note").hidden = !only1;
  if (only1) $("dist-note").textContent = `单块任务，没有块间分布可比 —— 这一块本身耗时 ${b.max} us。`;
  const W = 360, H = 132, PAD = 22, TOPY = 10, BASE = H - 20;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const bw = (W - PAD) / durs.length;
  const sc = (v) => (b.max ? (v / b.max) * (BASE - TOPY) : 0);
  durs.forEach((d, i) => {
    // the tail is what the panel is about, so only the slowest blocks take the accent
    const hot = !only1 && b.max > 0 && d >= b.max * 0.98;
    svg.append(el("rect", { x: PAD + i * bw, y: BASE - sc(d), width: Math.max(0.6, bw - (bw > 3 ? 0.6 : 0)),
      height: sc(d), fill: hot ? C.accent : C.AIC, opacity: hot ? 1 : .7 }));
  });
  const y = BASE - sc(b.mean);
  svg.append(el("line", { x1: PAD, x2: W, y1: y, y2: y, stroke: C.sel, "stroke-width": .8, "stroke-dasharray": "3 3" }));
  const t = el("text", { x: 0, y: y + 4, fill: C.sel, "font-family": "var(--mono)", "font-size": 12 });
  t.textContent = "均"; svg.append(t);
  const ax = el("text", { x: PAD, y: H - 6, fill: C.axis, "font-family": "var(--mono)", "font-size": 12 });
  ax.textContent = `${durs.length} 个块，按耗时升序 · 纵轴 0–${b.max} us`;
  svg.append(ax);
  const verdict = b.spread > 2 && b.p90 / (b.p50 || 1) < 1.4 ? "个别块掉队，查那一块的数据"
    : b.spread > 1.25 ? "整体偏斜，查切分粒度" : "分布均匀，无尾块问题";
  $("dist-kv").innerHTML = [
    ["块 / 波", `${b.n} 块 / ${l.waves} 波（${l.ct} 共 ${l.availCores} 核）`],
    ["耗时", `最慢 <b>${b.max}</b> / p90 ${b.p90} / 中位 ${b.p50} / 最快 ${b.min} us`],
    ["判读", `max÷均 <b class="${b.spread > 2 ? "hot" : ""}">${b.spread}x</b> · ${verdict}`],
  ].map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
}

// ---------- selected task ----------
function detail() {
  const l = R.launches.find((x) => x.id === me);
  if (!l) { $("detail").innerHTML = `<dt>—</dt><dd>选一个提交</dd>`; return; }
  const taskLabel = (id) => R.taskNames[id] || id;
  const preds = R.edges.filter((e) => e.succ === l.taskId).slice(0, 3).map((e) => taskLabel(e.pred));
  const succs = R.edges.filter((e) => e.pred === l.taskId).slice(0, 3).map((e) => taskLabel(e.succ));
  $("detail").innerHTML = [
    ["任务", `<b>${esc(l.leaf)}</b> · ${esc(l.ct)} · ${esc(l.compile.launchKind)}${l.compile.via ? ` · ${esc(l.compile.via)}` : ""}`],
    ["并行", `${l.compile.coreNum == null ? "submit 未携带 core_num" : `core_num ${esc(l.compile.coreNum)}`} → ${l.blocks.n} 块 / ${l.availCores} 核 / ${l.waves} 波`],
    ["耗时", `跨度 <b>${ms(l.spanUs)}</b> · 算 ${ms(l.computeUs)} · setup ${ms(l.setupUs)} ms`],
    ["搬运", `${mib(l.bytes)} MiB · ${l.gbPerS ?? "—"} GB/s（声明值，仅用于排序）`],
    ["编译期", `${esc(l.compile.type || "—")} · ${l.compile.bornPassName ? `P${l.compile.bornPass} ${esc(l.compile.bornPassName)} 生成` : "未匹配出生 pass"}`],
    ["依赖", `${preds.length ? preds.map(esc).join("、") : "无前驱"} → ${succs.length ? succs.map(esc).join("、") : "无后继"}`],
  ].map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
}

// ---------- wiring ----------
function paint() {
  header(); criticalPath(); renderLane(); distribution(); detail();
  const selected = R.launches.find((l) => l.id === me);
  $("drawer-sub").textContent = selected
    ? `${selected.leaf} · ${selected.ct} · ${selected.blocks.n} 块 / ${selected.waves} 波`
    : "点击泳道中的任务查看耗时分布与执行信息";
}
function setDrawer(open) {
  const drawer = $("task-drawer");
  drawer.classList.toggle("open", open);
  drawer.setAttribute("aria-hidden", String(!open));
}
function select(id) { if (!R.launches.some((l) => l.id === id)) return; me = id; paint(); setDrawer(true); }
function selectTask(taskId) {
  const l = R.launches.find((x) => x.taskId === taskId);
  if (!l) return;
  me = l.id;
  paint();
  setDrawer(false);
}
function setLens(id) {
  lens = id;
  const first = candidatesFor(id)[0];
  if (first) me = first.id;
  paint();
}
function loadRank(name) {
  setDrawer(false);
  laneRange = null;
  R = D.ranks.find((r) => r.rank === name) || D.ranks[0];
  // waves / available cores are display-only derivations, kept out of the data file
  R.launches.forEach((l) => {
    l.availCores = l.ct === "AIC" ? R.kpi.aicCores : R.kpi.aivCores;
    l.waves = Math.ceil(l.blocks.n / l.availCores);
  });
  me = null;
  paint();
}

try {
  D = JSON.parse($("lane-data").textContent);
} catch (e) {
  document.querySelector("main").innerHTML =
    `<section class="sec"><p>数据未内联或已损坏：${esc(e.message)}。<br/>重建：<code>node Design/device-perf-lane/scripts/build_perf_lane.mjs</code></p></section>`;
  D = null;
}
if (D) {
  $("run").textContent = `${D.run} / ${D.ranks[0].program}`;
  $("soc").textContent = `${D.soc.name} ${D.soc.aicCores}×AIC ${D.soc.aivCores}×AIV`;
  $("soc").title = D.soc.source;
  $("cav").innerHTML = D.caveats.map((c) => `<li>${esc(c)}</li>`).join("");
  $("rank").innerHTML = D.ranks.map((r) => `<option value="${esc(r.rank)}">${esc(r.rank)} · 窗口 ${ms(r.kpi.windowUs)} ms</option>`).join("");
  $("rank").onchange = (e) => loadRank(e.target.value);
  $("lens").addEventListener("click", (e) => { const b = e.target.closest("[data-lens]"); if (b) setLens(b.dataset.lens); });
  $("lane-ovl").addEventListener("click", (e) => {
    if (e.target.closest("[data-zoom-reset]")) { laneRange = null; renderLane(); return; }
    const v = e.target.closest("[data-view]");
    if (v) { laneView = v.dataset.view; renderLane(); return; }
    const b = e.target.closest("[data-ovl]"); if (!b) return;
    const k = b.dataset.ovl;
    if (k === "only") laneAll = !laneAll; else ovl[k] = !ovl[k];
    renderLane();
  });
  $("lane-ovl").addEventListener("change", (e) => {
    if (e.target.id === "lane-color") laneColor = e.target.value;
    else if (e.target.id === "task-layer") taskLayer = e.target.value;
    else return;
    renderLane();
  });
  $("drawer-close").addEventListener("click", () => setDrawer(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setDrawer(false); });
  $("lane-wrap").addEventListener("wheel", (e) => {
    if (!e.ctrlKey && !e.shiftKey) return;
    e.preventDefault();
    const full = R.kpi.windowUs, current = laneRange || [0, full];
    const currentSpan = current[1] - current[0];
    if (e.shiftKey && !e.ctrlKey) {
      const start = Math.max(0, Math.min(full - currentSpan, current[0] + Math.sign(e.deltaY) * currentSpan * .2));
      laneRange = start === 0 && currentSpan === full ? null : [start, start + currentSpan];
      if (!laneZoomRaf) laneZoomRaf = requestAnimationFrame(() => { laneZoomRaf = 0; renderLane(); });
      return;
    }
    const factor = e.deltaY < 0 ? .8 : 1.25;
    const minSpan = Math.max(1, full / 256), nextSpan = Math.min(full, Math.max(minSpan, currentSpan * factor));
    const svg = $("lane"), rect = svg.getBoundingClientRect(), W = svg.viewBox.baseVal.width;
    if (!rect.width || nextSpan === currentSpan) return;
    const x = (e.clientX - rect.left) / rect.width * W;
    const LEFT = laneLeft(), RIGHT = 12;
    const anchorRatio = Math.max(0, Math.min(1, (x - LEFT) / (W - LEFT - RIGHT)));
    const anchor = current[0] + currentSpan * anchorRatio;
    let start = anchor - nextSpan * anchorRatio;
    start = Math.max(0, Math.min(full - nextSpan, start));
    laneRange = nextSpan >= full - 1e-6 ? null : [start, start + nextSpan];
    if (!laneZoomRaf) laneZoomRaf = requestAnimationFrame(() => { laneZoomRaf = 0; renderLane(); });
  }, { passive: false });
  const laneWrap = $("lane-wrap");
  let laneDrag = null, suppressLaneClick = false;
  laneWrap.addEventListener("pointerdown", (e) => {
    if (!laneRange || e.button !== 0 || e.pointerType !== "mouse") return;
    const svg = $("lane"), rect = svg.getBoundingClientRect(), W = svg.viewBox.baseVal.width;
    const LEFT = laneLeft(), RIGHT = 12;
    const timelinePx = rect.width * (W - LEFT - RIGHT) / W;
    if (!timelinePx) return;
    laneDrag = { pointerId: e.pointerId, x: e.clientX, start: laneRange[0], span: laneRange[1] - laneRange[0], timelinePx, moved: false };
  });
  window.addEventListener("pointermove", (e) => {
    if (!laneDrag || e.pointerId !== laneDrag.pointerId) return;
    const dx = e.clientX - laneDrag.x;
    if (!laneDrag.moved && Math.abs(dx) < 4) return;
    laneDrag.moved = true;
    laneWrap.classList.add("is-dragging");
    e.preventDefault();
    const full = R.kpi.windowUs;
    const start = Math.max(0, Math.min(full - laneDrag.span, laneDrag.start - dx * laneDrag.span / laneDrag.timelinePx));
    laneRange = [start, start + laneDrag.span];
    if (!laneZoomRaf) laneZoomRaf = requestAnimationFrame(() => { laneZoomRaf = 0; renderLane(); });
  });
  const endLaneDrag = (e) => {
    if (!laneDrag || e.pointerId !== laneDrag.pointerId) return;
    const moved = laneDrag.moved;
    laneDrag = null;
    laneWrap.classList.remove("is-dragging");
    if (moved) {
      suppressLaneClick = true;
      setTimeout(() => { suppressLaneClick = false; }, 0);
    }
  };
  window.addEventListener("pointerup", endLaneDrag);
  window.addEventListener("pointercancel", endLaneDrag);
  laneWrap.addEventListener("click", (e) => {
    if (!suppressLaneClick) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true);
  let laneResizeRaf = 0;
  window.addEventListener("resize", () => {
    if (laneResizeRaf) cancelAnimationFrame(laneResizeRaf);
    laneResizeRaf = requestAnimationFrame(() => { laneResizeRaf = 0; criticalPath(); renderLane(); });
  });
  loadRank(D.ranks[0].rank);
}
})();
</script>
</body>
</html>
