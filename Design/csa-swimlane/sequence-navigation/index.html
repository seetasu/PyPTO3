<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Navigation · Variants</title>
<link rel="stylesheet" href="navigation.css"><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px/1.6 system-ui}main{max-width:1000px;margin:80px auto;padding:0 32px}h1{font-size:28px;font-weight:450}h2{font-size:18px;font-weight:450}p{color:#aaa}.example{margin:72px 0 100px}.readout{font:13px monospace;color:#bbb;margin:28px 0 52px}button.fit{border:1px solid #555;background:#222;color:#eee;border-radius:20px;padding:7px 16px;cursor:pointer}a{color:#ccc} .sequence-nav{margin-top:44px!important} .scene{height:90px;position:relative;overflow:hidden;background:#181818;margin:20px 0 36px;border-radius:4px}.scene svg{width:100%;height:100%;display:block}
</style><main><h1>Sequence Navigation</h1><p>同一视觉语言，两种定位方式。刻度位置固定，当前名称悬浮显示。</p>
<section class="example"><h2>01 · Stage navigation</h2><p>离散步骤：点击或使用左右键定位，当前步骤以白色突出。</p><div id="stage" aria-label="Stage navigation"></div><div id="stage-state" class="readout"></div></section>
<section class="example"><h2>02 · Time navigation</h2><p>连续范围：拖动白色范围框平移，拖动两端缩放；单击选择步骤，双击聚焦；平移和缩放保留选择。</p><div class="scene"><svg id="scene" viewBox="0 0 900 90" preserveAspectRatio="none"></svg></div><div id="time" aria-label="Time navigation"></div><div id="time-state" class="readout"></div><button class="fit" id="fit">Fit</button></section>
<a href="../../critical-path-swimlane/index.html">Open Inference Request →</a></main>
<script src="../../critical-path-swimlane/data.js"></script><script src="navigation.js"></script><script>
const data=SWIMLANE_DATA.steps;let offset=0;const items=data.map(s=>{const start=offset;offset+=s.end;return {label:s.id==='P'?'Prefill':s.id==='DI'?'Draft Init':'Decode '+s.id.slice(1),start,end:offset};});
let current=27,range=[items[25].start,items[29].end];
const stage=SequenceNavigation.mount(document.querySelector('#stage'),{items,variant:'stage',onSelect:i=>{stage.update({index:i});document.querySelector('#stage-state').textContent=items[i].label+' · '+(i+1)+' / '+items.length;}});stage.update({index:current});document.querySelector('#stage-state').textContent=items[current].label+' · '+(current+1)+' / '+items.length;
const time=SequenceNavigation.mount(document.querySelector('#time'),{items,variant:'time',full:[0,offset],onSelect:i=>{current=i;if(items[i].end<=range[0]||items[i].start>=range[1]){const w=range[1]-range[0],c=(items[i].start+items[i].end)/2,a=Math.max(0,Math.min(offset-w,c-w/2));range=[a,a+w];}draw();},onFocus:i=>{current=i;range=[items[i].start,items[i].end];draw();},onRange:r=>{range=r;draw();}});
function draw(){time.update({index:current,range});document.querySelector('#time-state').textContent=(range[0]/1000).toFixed(2)+'–'+(range[1]/1000).toFixed(2)+' s · '+items[current].label;const X=t=>(t-range[0])/(range[1]-range[0])*900;document.querySelector('#scene').innerHTML=items.map((it,i)=>[0,1,2,3].map(j=>'<line x1="'+X(it.start+(it.end-it.start)*j*.06)+'" x2="'+X(it.end-(it.end-it.start)*.05)+'" y1="'+(18+j*18)+'" y2="'+(18+j*18)+'" stroke="'+(i===current?'#eee':'#666')+'" stroke-width="2"/>').join('')).join('');}document.querySelector('#fit').onclick=()=>{range=[0,offset];draw();};draw();
</script></html>
