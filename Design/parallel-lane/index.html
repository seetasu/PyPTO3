    :root{

      --orch:#3987e5;--cube:#d95926;--vec:#199e70;

    *{box-sizing:border-box}

    body{font-size:12.5px}
    button,input,select{font:inherit;color:inherit}
    .app{min-height:100vh;display:grid;grid-template-rows:38px 1fr 22px;grid-template-columns:minmax(0,1fr)}

    .bar{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow:hidden}
    .bar .mark,.bar b{flex:0 0 auto}
    .mark{width:19px;height:19px;border:1px solid #4d5668;border-radius:5px;display:grid;place-items:center;color:var(--accent);font:700 10px var(--mono)}
    .bar b{font-weight:650;font-size:12px}
    .bar .path{color:var(--muted);font:10.5px var(--mono)}
    .sp{flex:1}
    .sel{height:25px;padding:0 7px;border:1px solid var(--line);border-radius:5px;background:#0c0e12;color:#d7dde7;font:10px var(--mono);max-width:46vw;min-width:0;flex:0 1 auto}
    .soc{color:var(--muted);font:10px var(--mono);white-space:nowrap}

    main{padding:12px 14px 26px;display:flex;flex-direction:column;gap:12px}

    .kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
    .kpi{padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
    .kpi.hero{grid-column:span 2;border-color:#3d3524;background:#15120b}
    .k-l{color:var(--faint);font:9.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .k-v{margin-top:4px;font:600 17px var(--mono);color:#e7edf6;letter-spacing:-.01em}

    .track{height:5px;margin-top:7px;border-radius:3px;background:#20242c;overflow:hidden;position:relative;display:flex}
    .track u{height:100%;text-decoration:none}
    .track i{position:absolute;top:-2px;bottom:-2px;width:1px;background:#8d95a3}

    .panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
    .ph{display:flex;align-items:center;gap:7px 9px;padding:9px 12px;border-bottom:1px solid var(--soft);flex-wrap:wrap}

    .ph strong{font-size:11.5px}

    svg{display:block;height:auto}
    #lane{min-width:1140px;width:100%}
    #tree{min-width:760px;width:100%}

    .dt{width:100%;border-collapse:collapse;font:10px var(--mono)}
    .dt th,.dt td{padding:5px 8px;border-bottom:1px solid var(--soft);text-align:left;white-space:nowrap}
    .dt th{color:var(--faint);font-weight:400;background:#13161c;position:sticky;top:0}
    .dt td.k{color:var(--faint)}
    .dt td.chg{color:#a9c2ff}
    .dt tbody tr:hover td{background:#14181f}
    .dwrap{overflow-x:auto;max-height:230px}
    .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--soft)}
    .dhead b{font:600 12px var(--mono);color:#cfd9ff}
    .dhead span{color:var(--faint);font:9.5px var(--mono)}
    .pill{padding:2px 6px;border:1px solid #39404e;border-radius:4px;color:#aab3c1;font:9px var(--mono)}

    details.caveat summary{padding:8px 12px;cursor:pointer;color:var(--muted);font:10px var(--mono);list-style:none}
    details.caveat summary::-webkit-details-marker{display:none}
    details.caveat summary:before{content:"▸ ";color:var(--faint)}
    details.caveat[open] summary:before{content:"▾ "}
    details.caveat ol{margin:0;padding:0 14px 10px 30px;color:var(--faint);font-size:10px;line-height:1.8}

    .status{display:flex;align-items:center;gap:10px;padding:0 10px;overflow:hidden;background:#13161c;border-top:1px solid var(--line);color:#767f8d;font:9.5px var(--mono)}

    .ok{color:#8ccfa2;white-space:nowrap}
    .tip{position:absolute;z-index:9;padding:7px 9px;border:1px solid #39414f;border-radius:6px;background:#0d1016f5;box-shadow:0 8px 24px #0009;color:#dbe2ec;font:9.5px/1.65 var(--mono);pointer-events:none;white-space:nowrap}

kind":"spmd_submit","line":3509,"coreNum":"bs_inline61_inline2238__ssa_v0","coreNumConst":null},{"from":"decode_csa_test","to":"kv_touch","kind":"submit","line":3523,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"csa_slots_build_valid_qk_plan","kind":"submit","line":3531,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"qk_pv_spmd","kind":"spmd_submit","line":3542,"coreNum":"24","coreNumConst":24},{"from":"decode_csa_test","to":"rope_cs","kind":"submit","line":3550,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"csa_merge_pack_publish_spmd","kind":"spmd_submit","line":3565,"coreNum":"48","coreNumConst":48},{"from":"decode_csa_test","to":"o_group_a2a_wait","kind":"submit","line":3567,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"o_group_a2a_gather_spmd","kind":"spmd_submit","line":3569,"coreNum":"48","coreNumConst":48},{"from":"decode_csa_test","to":"o_group_a2a_complete","kind":"submit","line":3572,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"tp_o_a_spmd","kind":"call","line":3589,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"tp_o_a_quant_spmd","kind":"call","line":3590,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"tp_o_b_spmd","kind":"call","line":3593,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"tp_o_b_dequant_spmd","kind":"call","line":3595,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"tp_o_b_publish_spmd","kind":"spmd_submit","line":3597,"coreNum":"24","coreNumConst":24},{"from":"decode_csa_test","to":"tp_o_rs_wait","kind":"submit","line":3599,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"tp_o_rs_reduce_spmd","kind":"spmd_submit","line":3601,"coreNum":"48","coreNumConst":48},{"from":"decode_csa_test","to":"tp_o_rs_complete","kind":"submit","line":3604,"coreNum":null,"coreNumConst":null},{"from":"decode_csa_test","to":"hc_post_spmd","kind":"call","line":3613,"coreNum":null,"coreNumConst":null},{"from":"l3_decode_csa","to":"decode_csa_test","kind":"call","line":3686,"coreNum":null,"coreNumConst":null}]},"caveats":["主体身份用函数名匹配。本 run 每个快照内函数名互不重复，pass 09 诞生的 64 个名字到最后一个快照一字未改，因此跨列连续性可靠；换一个 run 需重新核对。","并行宽度 core_num 多数是动态符号表达式，编译期取不到具体核数，页面只统计常量宽度。","ExpandMixedKernel 之后的核内拆分（PTOOutlineSIMTSections、VPTOSplitCVModule）在 PTOAS，不产出 pass dump，这里取不到。","函数体行数是 dump 文本行数，不是指令条数，只能横比不能当代价。","Cube:Vector 比的是函数个数，不是执行时间。配比偏离硬件只说明 vector 侧被切得更碎，是否真的失衡要看每个 kernel 的耗时，dump 里没有。"]}</script>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SVG = "http://www.w3.org/2000/svg";
const el = (n, a = {}) => { const e = document.createElementNS(SVG, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

// The payload is inlined by scripts/build_parallel_lane.mjs so the page also opens straight
// off disk: a relative fetch fails under file://, and under the data: URL the desktop file
// preview uses. data/parallel-lane.json stays the source of truth.
const D = JSON.parse($("lane-data").textContent);
const S = D.stages;

// --- category mapping -------------------------------------------------------
// Four things the eye needs to separate: scaffolding, not-yet-bound, cube, vector.
// Host / Orchestration / Spmd / Group are all scaffolding, so they share one hue;
// the tree panel below is where those four are told apart.
const CAT = { Host: "orch", Orchestration: "orch", Spmd: "orch", Group: "orch",
  InCore: "pending", AIC: "cube", AIV: "vec", Inline: "gone" };
const FILL = { orch: "#3987e5", pending: "#5c6472", cube: "#d95926", vec: "#199e70",
  gone: "#2e3542", absent: "#15181e" };
const catOf = (t) => (t ? CAT[t] || "pending" : "absent");

// --- subject order: band by what the function ends up as --------------------
const BAND = ["Host", "Orchestration", "Spmd", "Group", "AIC", "AIV", "Inline"];
const subjects = D.functions.slice().sort((a, b) => {
  const d = BAND.indexOf(a.finalType) - BAND.indexOf(b.finalType);
  return d || a.bornStage - b.bornStage || a.id.localeCompare(b.id);
});
const idx = new Map(subjects.map((f, i) => [f.id, i]));
const bands = [];
subjects.forEach((f, i) => {
  const b = bands[bands.length - 1];
  if (b && b.type === f.finalType) b.end = i; else bands.push({ type: f.finalType, start: i, end: i });
});

// --- tree indices -----------------------------------------------------------
const node = new Map(D.tree.nodes.map((n) => [n.name, n]));
const parentEdge = new Map();
const childEdges = new Map();
D.tree.edges.forEach((e) => {
  if (!parentEdge.has(e.to)) parentEdge.set(e.to, e);
  if (!childEdges.has(e.from)) childEdges.set(e.from, []);
  childEdges.get(e.from).push(e);
});

let me = null;

// --- KPIs -------------------------------------------------------------------
function kpis() {
  const k = D.kpi;
  const soc = D.soc;
  // Hero: the kernel mix measured against what the die actually has.
  const mine = k.vecPerCube;
  const theirs = k.socVecPerCube;
  const cap = Math.max(mine, theirs) * 1.15;
  const over = mine > theirs;
  const cards = [
    { hero: 1, l: `Cube : Vector 函数配比（硬件 1:${theirs}）`, v: `1 : ${mine.toFixed(2)}`,
      s: `${k.aic} 个 AIC · ${k.aiv} 个 AIV · ${over ? "vector 侧比硬件配比多 " + ((mine / theirs - 1) * 100).toFixed(0) + "%" : "在硬件配比内"}`,
      bar: [[mine / cap, over ? "linear-gradient(90deg,#8a5a22,#d9924a)" : "linear-gradient(90deg,#1d6a52,#2fa37c)"]],
      tick: theirs / cap },
    { l: "函数数", v: String(k.functionCount), s: k.functionTrail.join(" → ") },
    { l: "SPMD 任务 / 提交点", v: `${k.spmdTasks} / ${k.submitSites}`, s: `${k.spmdSites} 个 spmd_submit · ${k.submitSites - k.spmdSites} 个 submit` },
    { l: "调用树深度", v: String(k.treeDepth), s: k.levels.join(" → ") },
    { l: "叶子 kernel", v: String(k.leafCount), s: `占 ${((k.leafCount / k.functionCount) * 100).toFixed(0)}% · 其余为编排` },
    { l: "静态并行宽度", v: `${k.staticWidthSites} / ${k.spmdSites}`, s: `${k.dynamicWidthSites} 个动态 · 常量最大 ${k.maxStaticWidth}` },
  ];
  $("kpis").innerHTML = cards.map((c) => `
    <div class="kpi${c.hero ? " hero" : ""}">
      <div class="k-l">${esc(c.l)}</div><div class="k-v">${esc(c.v)}</div>
      ${c.bar ? `<div class="track">${c.bar.map(([w, g]) => `<u style="width:${(w * 100).toFixed(1)}%;background:${g}"></u>`).join("")}${c.tick != null ? `<i style="left:${(c.tick * 100).toFixed(1)}%"></i>` : ""}</div>` : ""}
      <div class="k-s">${esc(c.s)}</div>
    </div>`).join("");
}

// --- lane matrix ------------------------------------------------------------
const ROW = 2.9, GGAP = 11, TOP = 50, GUT = 150, CW = 126, CGAP = 10;
function lane() {
  const svg = $("lane");
  svg.textContent = "";
  const rows = subjects.length;
  const H = TOP + rows * ROW + bands.length * GGAP + 16;
  const W = GUT + S.length * (CW + CGAP);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);

  const yOf = (i) => {
    let y = TOP;
    for (const b of bands) {
      if (i <= b.end) { y += (i - b.start) * ROW; break; }
      y += (b.end - b.start + 1) * ROW + GGAP;
    }
    return y;
  };

  // Band labels down the gutter. A one-row band is 2.9 units tall and the label is 8.5px, so
  // labels are pushed apart to the next free slot and a leader line keeps them tied to the band.
  let lastLabel = -99;
  bands.forEach((b) => {
    const n = b.end - b.start + 1;
    const y = yOf(b.start);
    const mid = y + (n * ROW) / 2;
    svg.append(el("rect", { x: GUT - 7, y, width: 2, height: n * ROW, fill: FILL[catOf(b.type)], opacity: .55 }));
    const ty = Math.max(mid + 3, lastLabel + 10.5);
    lastLabel = ty;
    if (Math.abs(ty - 3 - mid) > 1.5) {
      svg.append(el("path", { d: `M${GUT - 11},${ty - 3} L${GUT - 8},${mid}`, stroke: "#39414f", "stroke-width": .5, fill: "none" }));
    }
    const t = el("text", { x: GUT - 13, y: ty, "text-anchor": "end",
      fill: "#737d8c", "font-family": "var(--mono)", "font-size": 8.5 });
    t.textContent = `${b.type === "Inline" ? "已内联" : b.type} ${n}`;
    svg.append(t);
  });

  S.forEach((st, c) => {
    const x = GUT + c * (CW + CGAP);
    const h1 = el("text", { x, y: 16, fill: "#c3ccd9", "font-family": "var(--mono)", "font-size": 9.5 });
    h1.textContent = `${st.index} ${st.pass}`.slice(0, 22);
    const h2 = el("text", { x, y: 29, fill: "#6d7786", "font-family": "var(--mono)", "font-size": 8.5 });
    h2.textContent = `${st.functionCount} 函数`;
    svg.append(h1, h2);
    if (st.retyped) {
      const h3 = el("text", { x, y: 41, fill: "#9db4ea", "font-family": "var(--mono)", "font-size": 8.5 });
      h3.textContent = `↻${st.retyped} 改类型`;
      svg.append(h3);
    } else if (st.born) {
      const h3 = el("text", { x, y: 41, fill: "#7f8a99", "font-family": "var(--mono)", "font-size": 8.5 });
      h3.textContent = `+${st.born} 新建`;
      svg.append(h3);
    } else if (st.absorbed) {
      const h3 = el("text", { x, y: 41, fill: "#7f8a99", "font-family": "var(--mono)", "font-size": 8.5 });
      h3.textContent = `−${st.absorbed} 内联`;
      svg.append(h3);
    }

    subjects.forEach((f, i) => {
      const cur = f.perStage[c];
      const prev = c ? f.perStage[c - 1] : null;
      const y = yOf(i);
      // fill channel = which core this function is bound to at this pass
      svg.append(el("rect", { x, y, width: CW, height: ROW - .5,
        fill: FILL[catOf(cur && cur.type)], "data-s": f.id, class: "cell" }));
      // edge channel = the type changed at this pass (kept separate from the fill)
      if (prev && cur && prev.type !== cur.type) {
        svg.append(el("rect", { x, y, width: 2.4, height: ROW - .5, fill: "#6f8fd8" }));
      }
    });
  });

  const hi = el("rect", { id: "hi", x: GUT - 4, y: 0, width: S.length * (CW + CGAP) - CGAP + 8,
    height: ROW + 2.4, fill: "none", stroke: "#4f7ef7", "stroke-width": 1.1, rx: 2, opacity: 0 });
  svg.append(hi);

  svg.onclick = (ev) => {
    const t = ev.target.getAttribute && ev.target.getAttribute("data-s");
    if (t) select(t);
  };
  svg.onmousemove = (ev) => {
    const t = ev.target.getAttribute && ev.target.getAttribute("data-s");
    if (!t) return hideTip();
    const f = D.functions.find((x) => x.id === t);
    const c = Math.min(S.length - 1, Math.max(0, Math.floor((ev.offsetX * (svg.viewBox.baseVal.width / svg.clientWidth) - GUT) / (CW + CGAP))));
    const cur = f.perStage[c];
    showTip(ev, `<b>${esc(f.name)}</b><br>${S[c].index} ${esc(S[c].pass)}<br>${cur ? `${esc(cur.type)}${cur.level ? " · " + esc(cur.level) : ""}` : "尚不存在"}`);
  };
  svg.onmouseleave = hideTip;
  return { yOf };
}
let laneGeom = null;

function markLane() {
  const hi = document.querySelector("#lane #hi");
  if (!hi || !laneGeom) return;
  const i = idx.get(me);
  hi.setAttribute("y", laneGeom.yOf(i) - 1.2);
  hi.setAttribute("opacity", 1);
}

// --- call tree --------------------------------------------------------------
function tree() {
  const svg = $("tree");
  svg.textContent = "";
  const byDepth = [];
  D.tree.nodes.forEach((n) => { (byDepth[n.depth] = byDepth[n.depth] || []).push(n); });
  byDepth.forEach((col) => col.sort((a, b) => BAND.indexOf(a.type) - BAND.indexOf(b.type) || a.name.localeCompare(b.name)));

  const NR = 7, NH = 5.4, NW = 86, CX = 150, TOPT = 26;
  const maxN = Math.max(...byDepth.map((c) => c.length));
  const H = TOPT + maxN * NR + 18;
  const W = 24 + byDepth.length * CX;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);

  const pos = new Map();
  byDepth.forEach((col, d) => {
    const x = 24 + d * CX;
    const t = el("text", { x, y: 14, fill: "#6d7786", "font-family": "var(--mono)", "font-size": 8.5 });
    t.textContent = `深度 ${d} · ${col.length}`;
    svg.append(t);
    col.forEach((n, i) => {
      const y = TOPT + i * NR;
      pos.set(n.name, { x, y, cx: x + NW, cy: y + NH / 2 });
    });
  });

  const edges = el("g", { "stroke-linecap": "round", fill: "none" });
  D.tree.edges.forEach((e) => {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) return;
    const mid = (a.cx + b.x) / 2;
    edges.append(el("path", {
      d: `M${a.cx},${a.cy} C${mid},${a.cy} ${mid},${b.y + NH / 2} ${b.x},${b.y + NH / 2}`,
      stroke: "#39414f", "stroke-width": e.kind === "call" ? .45 : .7,
      "stroke-dasharray": e.kind === "spmd_submit" ? "2 1.6" : "", "data-e": `${e.from}>${e.to}`,
    }));
  });
  svg.append(edges);

  byDepth.forEach((col) => col.forEach((n) => {
    const p = pos.get(n.name);
    svg.append(el("rect", { x: p.x, y: p.y, width: NW, height: NH, rx: 1.4,
      fill: FILL[catOf(n.type)], "data-s": n.name, class: "cell" }));
  }));

  const hi = el("rect", { id: "thi", x: 0, y: 0, width: NW + 4, height: NH + 4, fill: "none",
    stroke: "#4f7ef7", "stroke-width": 1.1, rx: 2.4, opacity: 0 });
  svg.append(hi);

  svg.onclick = (ev) => {
    const t = ev.target.getAttribute && ev.target.getAttribute("data-s");
    if (t && idx.has(t)) select(t);
  };
  svg.onmousemove = (ev) => {
    const t = ev.target.getAttribute && ev.target.getAttribute("data-s");
    if (!t) return hideTip();
    const n = node.get(t);
    const pe = parentEdge.get(t);
    showTip(ev, `<b>${esc(t)}</b><br>${esc(n.type)}${n.level ? " · " + esc(n.level) : ""}<br>`
      + (pe ? `${esc(pe.kind)} ← ${esc(pe.from)}${pe.coreNum ? `<br>core_num = ${esc(pe.coreNum)}` : ""}` : "根")
      + `<br>${n.bodyLines} 行 · ${(childEdges.get(t) || []).length} 个子调用`);
  };
  svg.onmouseleave = hideTip;
  return { pos };
}
let treeGeom = null;

function markTree() {
  const hi = document.querySelector("#tree #thi");
  if (!hi || !treeGeom) return;
  const p = treeGeom.pos.get(me);
  if (!p) return hi.setAttribute("opacity", 0);
  hi.setAttribute("x", p.x - 2); hi.setAttribute("y", p.y - 2); hi.setAttribute("opacity", 1);
  document.querySelectorAll("#tree path[data-e]").forEach((q) => {
    const [from, to] = q.getAttribute("data-e").split(">");
    const on = from === me || to === me;
    q.setAttribute("stroke", on ? "#6f8fd8" : "#39414f");
    q.setAttribute("stroke-width", on ? 1.2 : (q.getAttribute("stroke-dasharray") ? .7 : .45));
  });
}

// --- detail -----------------------------------------------------------------
const ROWS = [
  ["类型", (s) => s.type],
  ["层级", (s) => s.level || "—"],
  ["角色", (s) => s.role || "—"],
  ["体量", (s) => `${s.bodyLines} 行`],
  ["dump 行", (s) => `L${s.defLine}`],
];
function detail() {
  const f = D.functions.find((x) => x.id === me);
  const n = node.get(f.name);
  const pe = parentEdge.get(f.name);
  const kids = childEdges.get(f.name) || [];
  $("dname").textContent = f.name;
  $("dmeta").textContent = [
    f.nameReused ? `名字复用 第 ${f.incarnation}/${f.incarnations} 次` : null,
    `${S[f.bornStage].index} 出现`,
    f.absorbed ? `${S[f.lastStage].index} 后被内联` : `存活到 ${S[f.lastStage].index}`,
    f.retypes ? `改类型 ${f.retypes} 次` : "类型未变",
  ].filter(Boolean).join(" · ");
  $("dpar").textContent = pe
    ? `${pe.kind} ← ${pe.from}${pe.coreNum ? ` · core_num=${pe.coreNum}` : ""}`
    : (n ? "调用树根" : "不在最终程序中");
  $("dpar").title = kids.length ? `子调用：${kids.map((e) => e.to).join(", ")}` : "无子调用";

  $("dth").innerHTML = `<tr><th>字段</th>${S.map((s) => `<th>${s.index} ${esc(s.pass)}</th>`).join("")}</tr>`;
  $("dtb").innerHTML = ROWS.map(([label, get]) => {
    const tds = f.perStage.map((s, i) => {
      if (!s) return `<td class="k">—</td>`;
      const prev = i ? f.perStage[i - 1] : null;
      const v = get(s);
      const chg = prev && get(prev) !== v;
      return `<td class="${chg ? "chg" : ""}">${esc(v)}</td>`;
    }).join("");
    return `<tr><td class="k">${esc(label)}</td>${tds}</tr>`;
  }).join("");
}

// --- tooltip ----------------------------------------------------------------
let tipEl = null;
function showTip(ev, html) {
  if (!tipEl) { tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.append(tipEl); }
  tipEl.innerHTML = html;
  tipEl.style.left = `${Math.min(ev.pageX + 13, innerWidth - tipEl.offsetWidth - 10)}px`;
  tipEl.style.top = `${ev.pageY + 13}px`;
  tipEl.style.display = "block";
}
function hideTip() { if (tipEl) tipEl.style.display = "none"; }

// --- wiring -----------------------------------------------------------------
function select(id) {
  if (!idx.has(id)) return;
  me = id;
  $("pick").value = id;
  markLane(); markTree(); detail();
  $("st").textContent = `观测主体 ${D.functions.find((x) => x.id === me).name} · 点矩阵行或树节点可换`;
}

$("run").textContent = `${D.run} / ${D.program}`;
$("soc").textContent = `${D.soc.name} ${D.soc.aicCores}×AIC ${D.soc.aivCores}×AIV`;
$("soc").title = D.soc.source;
$("scount").textContent = String(subjects.length);
$("tcount").textContent = String(D.tree.nodes.length);
$("ecount").textContent = String(D.tree.edges.length);
$("cav").innerHTML = D.caveats.map((c) => `<li>${esc(c)}</li>`).join("");
$("src").textContent = D.sourceDirectory;
$("pick").innerHTML = subjects.map((f) =>
  `<option value="${esc(f.id)}">${esc(f.name)}${f.nameReused ? ` (#${f.incarnation})` : ""} · ${esc(f.finalType)}</option>`).join("");
$("pick").onchange = (e) => select(e.target.value);

kpis();
laneGeom = lane();
treeGeom = tree();

// Default protagonist: a function that actually gets re-typed and is reachable in the
// final tree, so the lane and the tree both have something to show.
const best = subjects.find((f) => f.retypes && node.has(f.name) && (childEdges.get(f.name) || []).length)
  || subjects.find((f) => f.retypes) || subjects[0];
select(best.id);
</script>
