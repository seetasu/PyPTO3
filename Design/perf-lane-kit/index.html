<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Device Perf Lane</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><h1>Device Perf Lane</h1><span id="source">加载数据中…</span><div class="sp"></div><label class="upload">导入 JSON<input id="file" type="file" accept=".json,application/json"></label><label class="mock-label" id="mock-label" hidden><input id="mock" type="checkbox"> 原 Demo 对照数据（含 Mock）</label><button id="analysis-toggle" type="button" aria-controls="analysis-panel" aria-expanded="false">展开性能分析</button><label class="mode-label">呈现 <select id="display-mode" aria-label="呈现模式"><option value="combined">关键路径与泳道</option><option value="critical">仅关键路径</option><option value="lane">仅泳道</option></select></label><label class="rank-label">Rank <select id="rank"></select></label></header>
<div id="error" role="alert" hidden></div><div id="mode-notice" role="status" hidden></div><dl class="summary" id="summary"></dl>
<main><div class="main-column"><div class="trace-pair"><section class="path-section" id="path-section"><div class="sec-h"><h2>关键路径</h2><span class="view-tag">依赖顺序</span><span id="path-info" class="muted"></span><div class="sp"></div><div class="path-legend"><span>■ 单块任务（未必等待）</span><span>■ 计算任务</span><span>■ 当前选中</span></div></div><div class="scroll path-scroll"><svg id="critical" role="img" aria-label="关键路径"></svg></div></section>
<section class="lane-section" id="lane-section"><div class="scroll lane-scroll" id="viewport" title="Ctrl + 滚轮缩放；缩放后可拖动平移"><div class="axis-sticky"><svg id="lane-axis" aria-label="设备时间轴"></svg></div><svg id="lane" role="img" aria-label="设备泳道"></svg></div><p class="legend" id="legend"></p><div class="lane-toolbar" role="toolbar" aria-label="泳道视图与图层"><label>地标视角 <select id="lens"><option value="wait">关键路径单块</option><option value="tail">尾块浪费</option><option value="setup">启动开销</option><option value="waves">并行波次</option></select></label><label>视图 <select id="view"><option value="core">按物理核</option><option value="task">按 Task</option></select></label><button id="rows" aria-pressed="false">展开行</button><label><input id="ribbon" type="checkbox" checked> 并行宽度</label><label><input id="marks" type="checkbox" checked> 地标</label><label><input id="bands" type="checkbox" checked> 低并行区</label><label><input id="composition" type="checkbox"> 耗时构成</label><label>Task 分布 <select id="feature"><option value="recommended">系统推荐</option><option value="none" selected>关闭</option><option value="tail">拖尾任务</option><option value="parallel">Task 并行度不足</option><option value="imbalance">块负载不均</option><option value="underfill">尾波空置</option><option value="fragmented">离散小 Task</option><option value="setup">Setup 占比高</option><option value="bubble">依赖间隔</option></select></label><span class="zoom"><button id="zoom-in" aria-label="放大时间轴">＋</button><button id="zoom-out" aria-label="缩小时间轴">−</button><button id="reset">全局</button></span></div><p class="range" id="range"></p></section></div></div>
<aside class="analysis-panel" id="analysis-panel" hidden><div class="sec-h"><h2>性能分析</h2></div><p class="reference-note">专题案例使用原 Demo 的独立样例数据</p><a class="reference-link" href="/reference/" target="_blank" rel="noopener">打开原 Demo · QK / Pass / Paged Attention ↗</a><div id="analysis"><p class="muted">选择 Task 分布特征，查看当前运行中的筛查线索。</p></div></aside></main>
<section class="task-drawer" id="drawer" hidden aria-label="任务分析"><div class="drawer-head"><h2>任务分析</h2><button id="close-detail" aria-label="关闭任务分析">×</button></div><div id="detail" class="muted"></div></section><dialog id="drilldown"><div class="drill-header"><strong>原 Demo 专题下钻 · Mock 对照</strong><button id="close-drilldown">关闭 ×</button></div><iframe id="drill-frame" title="原 Demo 专题下钻"></iframe></dialog><script src="/reference/qk-residency.js"></script><script type="module" src="src/app.js"></script></body></html>
