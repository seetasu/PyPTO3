<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">一项算子任务中的人、Agent 与工具</title><desc id="d">开发者给 Agent 目标与授权，Agent 调用工具，工具将执行结果返回 Agent，Agent 向人报告候选并接受决策。开发者可以直接查看工具产生的证据；三方围绕共享任务状态协作。</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1a33"/><stop offset="1" stop-color="#142b49"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#355d9c" stop-opacity=".34"/><stop offset="1" stop-color="#21395a" stop-opacity="0"/></radialGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b558e"/><stop offset="1" stop-color="#142c51"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#06101f" flood-opacity=".42"/></filter>
<marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#8aacf3"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#67d0c5"/></marker><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#e7ba73"/></marker>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.white{fill:#f5f8ff}.muted{fill:#a4b6cf}.caption{font-size:16px;fill:#a4b6cf}.role{font-size:25px;font-weight:700;fill:#f8fbff}.action{font-size:16px;fill:#c9d8ed}.tag{font-size:15px;font-weight:700;letter-spacing:2px}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="800" cy="455" r="440" fill="url(#halo)"/>
<text x="76" y="74" font-size="15" font-weight="700" letter-spacing="3" fill="#80a7e6">AGENTIC OPERATOR DEVELOPMENT</text><text x="76" y="128" font-size="39" font-weight="700" class="white">一项算子任务，三方持续协作</text><text x="77" y="164" font-size="19" fill="#a8bddb">人定义和决策 · Agent 组织迭代 · 工具执行并提供证据</text>
<!-- orbit and central task -->
<ellipse cx="800" cy="459" rx="450" ry="243" fill="none" stroke="#88aada" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="5 9"/>
<circle cx="800" cy="461" r="158" fill="none" stroke="#90b2e4" stroke-opacity=".14" stroke-width="1"/><circle cx="800" cy="461" r="134" fill="url(#core)" stroke="#84a7da" stroke-opacity=".35" stroke-width="1.5" filter="url(#shadow)"/>
<text x="800" y="422" text-anchor="middle" font-size="15" letter-spacing="2" fill="#a9c8f3">SHARED TASK</text><text x="800" y="465" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">共享算子任务</text><line x1="723" y1="482" x2="877" y2="482" stroke="#7194c7" stroke-opacity=".5"/><text x="800" y="513" text-anchor="middle" font-size="16" fill="#cfdef3">目标 · 候选 · 运行 · 证据</text><text x="800" y="540" text-anchor="middle" font-size="15" fill="#9eb7db">状态持续沉淀与关联</text>
<!-- node halos and nodes -->
<circle cx="800" cy="230" r="74" fill="#7699ec" opacity=".09"/><circle cx="800" cy="230" r="57" fill="#223c6b" stroke="#9cb8f3" stroke-width="2" filter="url(#shadow)"/>
<circle cx="800" cy="216" r="11" fill="none" stroke="#dbe8ff" stroke-width="2.8"/><path d="M779 250 Q800 226 821 250" fill="none" stroke="#dbe8ff" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="465" cy="574" r="74" fill="#e7ba73" opacity=".08"/><circle cx="465" cy="574" r="57" fill="#524330" stroke="#e7ba73" stroke-width="2" filter="url(#shadow)"/><rect x="445" y="557" width="40" height="34" rx="9" fill="none" stroke="#ffe0ac" stroke-width="2.6"/><path d="M455 570 h2 M473 570 h2 M455 580 h20 M465 550 v7" stroke="#ffe0ac" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="1135" cy="574" r="74" fill="#67d0c5" opacity=".08"/><circle cx="1135" cy="574" r="57" fill="#20524f" stroke="#75d4c9" stroke-width="2" filter="url(#shadow)"/><rect x="1114" y="558" width="42" height="30" rx="5" fill="none" stroke="#c4f4ec" stroke-width="2.5"/><path d="M1121 566 h7 M1121 573 h20 M1121 580 h14 M1127 589 v5 M1143 589 v5" fill="none" stroke="#c4f4ec" stroke-width="2.5" stroke-linecap="round"/>
<!-- outer relationships directional -->
<path d="M735 248 C600 269 495 358 469 498" fill="none" stroke="#8aacf3" stroke-width="2.6" marker-end="url(#a)"/><rect x="500" y="312" width="164" height="34" rx="17" fill="#233c62"/><text x="582" y="335" text-anchor="middle" font-size="15" fill="#c6d9ff">目标 · 约束 · 授权</text>
<path d="M524 622 C675 735 922 735 1073 622" fill="none" stroke="#e7ba73" stroke-width="2.6" marker-end="url(#c)"/><rect x="709" y="697" width="182" height="34" rx="17" fill="#4a4034"/><text x="800" y="720" text-anchor="middle" font-size="15" fill="#ffe0aa">调用编译 · 测试 · 测量</text>
<path d="M1138 500 C1120 356 1009 267 866 248" fill="none" stroke="#67d0c5" stroke-width="2.6" marker-end="url(#b)"/><rect x="951" y="312" width="140" height="34" rx="17" fill="#24504e"/><text x="1021" y="335" text-anchor="middle" font-size="15" fill="#c9f4ed">证据可供人审查</text>
<!-- inner return -->
<path d="M1075 551 C1037 522 1004 495 963 474" fill="none" stroke="#68cabe" stroke-width="1.8" stroke-dasharray="5 5"/><path d="M640 474 C600 494 565 521 525 551" fill="none" stroke="#e9bd7e" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="1060" y="487" text-anchor="middle" font-size="15" fill="#90d5cb">运行结果回流</text><text x="539" y="487" text-anchor="middle" font-size="15" fill="#e3c59a">候选与进展</text>
<!-- explanatory side labels -->
<text x="800" y="318" text-anchor="middle" class="role">开发者</text><text x="800" y="345" text-anchor="middle" class="caption">定义任务 · 审查与决策</text>
<text x="167" y="557" class="tag" fill="#e7ba73">AGENT</text><text x="167" y="592" class="role">组织迭代</text><text x="167" y="622" class="action">理解上下文 · 生成候选</text><text x="167" y="648" class="action">根据反馈调整并汇报</text><line x1="348" y1="575" x2="399" y2="575" stroke="#b89a6c" stroke-opacity=".6"/>
<text x="1240" y="557" class="tag" fill="#75d4c9">TOOLKIT</text><text x="1240" y="592" class="role">执行与取证</text><text x="1240" y="622" class="action">编译 · 验证 · 性能测量</text><text x="1240" y="648" class="action">保留环境和原始产物</text><line x1="1200" y1="575" x2="1230" y2="575" stroke="#75c1b6" stroke-opacity=".6"/>
<!-- footer -->
<line x1="76" y1="802" x2="1524" y2="802" stroke="#7086a6" stroke-opacity=".28"/><text x="78" y="841" font-size="17" fill="#d5e0f0">关键取舍由人决定，Agent 在授权内推进，结论回到工具证据。</text><text x="1523" y="841" text-anchor="end" font-size="15" fill="#8299ba">概念示意 · 非固定执行顺序</text>
</svg>
