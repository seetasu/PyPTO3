<title id="t">Hardware-Native 的六类承载形态</title><desc id="d">六种承载依次帮助表达、查询、检查、归因、观察和复用硬件事实。</desc>
<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#e8e8e8}.muted{fill:#aaa;font-size:13px}.code{fill:#b1ef6b;font-size:19px;font-weight:700}.box{fill:#191919;stroke:#444}.arr{stroke:#888;stroke-width:2;fill:none}</style><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#888"/></marker></defs>
<rect width="1040" height="310" rx="12" fill="#111"/><text x="35" y="35" fill="#79d4f2" font-size="11" letter-spacing="2">FROM HARDWARE FACT TO ENGINEERING EVIDENCE</text>
<g><rect class="box" x="32" y="85" width="146" height="110" rx="9"/><rect class="box" x="202" y="85" width="146" height="110" rx="9"/><rect class="box" x="372" y="85" width="146" height="110" rx="9"/><rect class="box" x="542" y="85" width="146" height="110" rx="9"/><rect class="box" x="712" y="85" width="146" height="110" rx="9"/><rect class="box" x="882" y="85" width="126" height="110" rx="9"/></g>
<g text-anchor="middle"><text class="code" x="105" y="119">E</text><text x="105" y="148">表达</text><text class="muted" x="105" y="174">把约束写进程序</text><text class="code" x="275" y="119">Q</text><text x="275" y="148">查询</text><text class="muted" x="275" y="174">先知道目标能力</text><text class="code" x="445" y="119">C</text><text x="445" y="148">校验</text><text class="muted" x="445" y="174">尽早发现不合法</text><text class="code" x="615" y="119">A</text><text x="615" y="148">归因</text><text class="muted" x="615" y="174">解释编译选择</text><text class="code" x="785" y="119">O</text><text x="785" y="148">观测</text><text class="muted" x="785" y="174">检查真实执行</text><text class="code" x="945" y="119">R</text><text x="945" y="148">复用</text><text class="muted" x="945" y="174">沉淀验证范式</text></g>
<path d="M180 140 H195 M350 140 H365 M520 140 H535 M690 140 H705 M860 140 H875" class="arr" marker-end="url(#a)"/>
<text x="35" y="245" class="muted">示例：目标容量</text><text x="180" y="245" class="muted">→ 查询剩余空间</text><text x="365" y="245" class="muted">→ 检查 Tile 是否放得下</text><text x="610" y="245" class="muted">→ 解释为何缩短流水</text><text x="35" y="274" class="muted">→ 内存报告展示 buffer / slot</text><text x="365" y="274" class="muted">→ 范式示例给出合法的 Tile 深度与复用方式</text>
