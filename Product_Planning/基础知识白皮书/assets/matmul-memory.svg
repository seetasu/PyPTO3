<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
 <title id="title">矩阵乘法的分块与内存路径</title><desc id="desc">A、B 从 DDR 进入片上存储，再送入矩阵输入缓冲区并在累加器中得到 C 的 tile。</desc>
 <defs><style>.bg{fill:#141414}.t{fill:#e8e8e8;font:16px Inter,'Microsoft YaHei',sans-serif}.s{fill:#999;font:12px Inter,'Microsoft YaHei',sans-serif}.m{fill:#b1ef6b;font:700 13px ui-monospace,monospace}.box{fill:#202020;stroke:#4a4a4a}.ddr{stroke:#547b88}.l1{stroke:#657f4c}.l0{stroke:#716092}.acc{stroke:#8b713e}.line{stroke:#868686;stroke-width:2;fill:none;marker-end:url(#a)}.grid{fill:#202020;stroke:#545454}.hl{fill:#435a31;stroke:#a2d06b}</style><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#868686"/></marker></defs>
 <rect class="bg" width="1000" height="480" rx="12"/><text class="t" x="34" y="40">例：A[2×3] × B[3×2] → C[2×2]</text><text class="s" x="34" y="66">A=[[1,2,3],[4,5,6]] · B=[[7,8],[9,10],[11,12]] · C=[[58,64],[139,154]]</text>
 <text class="m" x="45" y="126">A · DDR</text><g><rect class="grid" x="45" y="145" width="62" height="45"/><rect class="hl" x="107" y="145" width="62" height="45"/><rect class="grid" x="169" y="145" width="62" height="45"/><rect class="grid" x="45" y="190" width="62" height="45"/><rect class="hl" x="107" y="190" width="62" height="45"/><rect class="grid" x="169" y="190" width="62" height="45"/><g class="t" text-anchor="middle"><text x="76" y="174">1</text><text x="138" y="174">2</text><text x="200" y="174">3</text><text x="76" y="219">4</text><text x="138" y="219">5</text><text x="200" y="219">6</text></g></g>
 <text class="m" x="45" y="286">B · DDR</text><g><rect class="grid" x="45" y="305" width="62" height="45"/><rect class="hl" x="107" y="305" width="62" height="45"/><rect class="grid" x="45" y="350" width="62" height="45"/><rect class="hl" x="107" y="350" width="62" height="45"/><rect class="grid" x="45" y="395" width="62" height="45"/><rect class="hl" x="107" y="395" width="62" height="45"/><g class="t" text-anchor="middle"><text x="76" y="334">7</text><text x="138" y="334">8</text><text x="76" y="379">9</text><text x="138" y="379">10</text><text x="76" y="424">11</text><text x="138" y="424">12</text></g></g>
 <path class="line" d="M245 185h75M245 370h75"/><rect class="box l1" x="325" y="132" width="140" height="270" rx="8"/><text class="m" x="395" y="164" text-anchor="middle">Mat / L1</text><text class="s" x="395" y="190" text-anchor="middle">操作数 staging</text><rect class="hl" x="352" y="220" width="86" height="48" rx="4"/><text class="t" x="395" y="250" text-anchor="middle">A tile</text><rect class="hl" x="352" y="292" width="86" height="48" rx="4"/><text class="t" x="395" y="322" text-anchor="middle">B tile</text>
 <path class="line" d="M465 244h68M465 316h68"/><rect class="box l0" x="540" y="174" width="145" height="182" rx="8"/><text class="m" x="612" y="205" text-anchor="middle">L0 operands</text><rect class="box l0" x="562" y="226" width="100" height="48" rx="4"/><text class="t" x="612" y="256" text-anchor="middle">Left / L0A</text><rect class="box l0" x="562" y="292" width="100" height="48" rx="4"/><text class="t" x="612" y="322" text-anchor="middle">Right / L0B</text>
 <path class="line" d="M685 264h73"/><rect class="box acc" x="765" y="174" width="185" height="182" rx="8"/><text class="m" x="857" y="205" text-anchor="middle">Acc / L0C</text><rect class="hl" x="798" y="226" width="120" height="88" rx="5"/><text class="t" x="858" y="252" text-anchor="middle">矩阵累加</text><text class="s" x="858" y="278" text-anchor="middle">C tile</text><text class="s" x="858" y="299" text-anchor="middle">[[58,64],[139,154]]</text>
 <text class="s" x="325" y="442">高亮部分表示本轮使用的数据区域；实际 Tile shape、布局、搬运和复用由代码与编译结果确定。</text>
</svg>
