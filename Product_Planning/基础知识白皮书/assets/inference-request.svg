<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 285" role="img" aria-labelledby="t d">
<title id="t">一次生成请求的生命周期</title><desc id="d">请求从接入和排队开始，经过调度、Prefill、反复Decode和流式返回，KV Cache贯穿生成过程。</desc>
<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#e8e8e8}.muted{fill:#aaa;font-size:12px}.head{font-size:14px;font-weight:700}.box{fill:#191919;stroke:#444}.arr{stroke:#777;stroke-width:2;fill:none}.green{fill:#b1ef6b}.blue{fill:#79d4f2}.violet{fill:#bca0f3}.amber{fill:#f2c45f}</style><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#777"/></marker></defs>
<rect width="1040" height="285" rx="12" fill="#111"/><text x="32" y="34" class="green" font-size="11" letter-spacing="2">ONE REQUEST · MANY STAGES</text>
<g><rect class="box" x="34" y="82" width="145" height="86" rx="8"/><rect class="box" x="213" y="82" width="155" height="86" rx="8"/><rect class="box" x="402" y="82" width="145" height="86" rx="8"/><rect class="box" x="581" y="82" width="165" height="86" rx="8"/><rect class="box" x="780" y="82" width="150" height="86" rx="8"/><rect class="box" x="954" y="82" width="58" height="86" rx="8"/></g>
<text x="51" y="111" class="amber head">接入 / 排队</text><text x="51" y="139" class="muted">路由 · 等待</text><text x="230" y="111" class="blue head">调度 / 批处理</text><text x="230" y="139" class="muted">选择一起执行的请求</text><text x="419" y="111" class="green head">Prefill</text><text x="419" y="139" class="muted">读完整段 prompt</text><text x="598" y="111" class="violet head">Decode × N 步</text><text x="598" y="139" class="muted">每步生成后续 token</text><text x="796" y="111" class="blue head">流式返回</text><text x="796" y="139" class="muted">逐步交付结果</text><text x="967" y="123" class="green head">完成</text>
<path d="M182 125 H204 M371 125 H393 M550 125 H572 M749 125 H771 M933 125 H946" class="arr" marker-end="url(#a)"/>
<path d="M463 201 H706 M463 201 V180 M706 201 V180" stroke="#56727c" stroke-width="2" fill="none"/><rect x="499" y="216" width="170" height="38" rx="7" fill="#151c1e" stroke="#45616a"/><text x="528" y="240" class="blue">KV Cache · 复用状态</text><text x="34" y="242" class="muted">生活类比：取号 → 读备注备料 → 分步制作 → 做好一部分先上桌</text>
</svg>
