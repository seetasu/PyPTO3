<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 315" role="img" aria-labelledby="t d">
<title id="t">算子开发与验收闭环</title><desc id="d">按规格、编译、数值验证、性能测量和交付建立分阶段门槛；失败时回到相应步骤。</desc>
<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#e8e8e8}.muted{fill:#aaa;font-size:12px}.head{font-size:14px;font-weight:700}.box{fill:#191919;stroke:#444}.arr{stroke:#777;stroke-width:2;fill:none}.green{fill:#b1ef6b}.blue{fill:#79d4f2}.violet{fill:#bca0f3}.amber{fill:#f2c45f}</style><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#777"/></marker></defs>
<rect width="1040" height="315" rx="12" fill="#111"/><text x="32" y="35" class="green" font-size="11" letter-spacing="2">SEPARATE GATES · CLOSE THE LOOP</text>
<g><rect class="box" x="34" y="90" width="175" height="92" rx="8"/><rect class="box" x="242" y="90" width="175" height="92" rx="8"/><rect class="box" x="450" y="90" width="175" height="92" rx="8"/><rect class="box" x="658" y="90" width="175" height="92" rx="8"/><rect class="box" x="866" y="90" width="145" height="92" rx="8"/></g>
<text x="54" y="121" class="blue head">规格</text><text x="54" y="151" class="muted">定义输入与答案</text><text x="262" y="121" class="violet head">编译</text><text x="262" y="151" class="muted">结构合法 / 资源可行</text><text x="470" y="121" class="green head">数值验证</text><text x="470" y="151" class="muted">对照 reference</text><text x="678" y="121" class="amber head">性能测量</text><text x="678" y="151" class="muted">固定口径做 A/B</text><text x="886" y="121" class="blue head">交付</text><text x="886" y="151" class="muted">证据可复现</text>
<path d="M212 136 H234 M420 136 H442 M628 136 H650 M836 136 H858" class="arr" marker-end="url(#a)"/>
<path d="M731 194 V234 H118 V194" class="arr" marker-end="url(#a)"/><text x="333" y="260" class="muted">失败时回到最早不满足的门槛；性能优化后重新跑数值门槛</text><text x="34" y="291" fill="#777" font-size="11">类比装修验收：图纸、结构、水电和预算分别验收，某一项通过不代表整屋交付。</text>
