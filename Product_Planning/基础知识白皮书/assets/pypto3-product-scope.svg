<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">PyPTO 3.0 产品建设范围</title><desc id="desc">PyPTO 3.0 Toolkit 通过 CLI、IDE 和可视化工作台连接开发证据底座、编译与正确性、性能、模型推理和服务验证，并明确不替代核心引擎或生产运维。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101411"/><stop offset="1" stop-color="#202820"/></linearGradient><style>.bg{fill:url(#bg)}.card{fill:#19211b;stroke:#35483a;stroke-width:1.5}.core{fill:#263626;stroke:#a7df70;stroke-width:2}.boundary{fill:#141915;stroke:#657365;stroke-width:1.5;stroke-dasharray:7 6}.title{fill:#f3f6f1;font:700 25px system-ui,sans-serif}.label{fill:#e8f0e5;font:650 15px system-ui,sans-serif}.sub{fill:#aab7aa;font:13px system-ui,sans-serif}.tiny{fill:#9da99d;font:12px system-ui,sans-serif}.lime{fill:#b7f36b;font:700 12px system-ui,sans-serif}.link{stroke:#78916f;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#78916f"/></marker></defs>
<rect class="bg" width="1000" height="540" rx="22"/>
<text x="40" y="48" class="lime" style="font-size:13px;letter-spacing:2px">PRODUCT SCOPE · PLANNED DIRECTION</text><text x="40" y="85" class="title">从开发意图到可信推理产物</text>
<rect class="card" x="40" y="115" width="920" height="72" rx="14"/><text class="tiny" x="62" y="143">三个入口 · 共享项目配置与证据协议</text><text class="label" x="62" y="168">CLI</text><text class="sub" x="115" y="168">自动化 / 专家操作</text><text class="label" x="376" y="168">IDE 扩展</text><text class="sub" x="470" y="168">编码反馈 / 源码下钻</text><text class="label" x="712" y="168">Toolkit Studio</text><text class="sub" x="838" y="168">可视分析</text>
<path class="link" d="M500 190V213"/>
<rect class="core" x="40" y="222" width="920" height="79" rx="15"/><text class="lime" x="62" y="250">共同底座</text><text class="label" x="62" y="279">项目 / 环境画像</text><text class="label" x="270" y="279">统一 Run 与产物</text><text class="label" x="502" y="279">源码 → IR → 设备 → Task → 指标</text><text class="label" x="806" y="279">可追溯、可复现</text>
<path class="link" d="M500 303V324"/>
<g><rect class="card" x="40" y="333" width="214" height="108" rx="14"/><text class="lime" x="58" y="360">01 · 表达与编译</text><text class="label" x="58" y="388">DSL · 编译安全</text><text class="sub" x="58" y="414">把意图映射到目标约束</text></g>
<g><rect class="card" x="270" y="333" width="214" height="108" rx="14"/><text class="lime" x="288" y="360">02 · 可信调试</text><text class="label" x="288" y="388">追踪 · 正确性</text><text class="sub" x="288" y="414">定位首个偏差与复现</text></g>
<g><rect class="card" x="500" y="333" width="214" height="108" rx="14"/><text class="lime" x="518" y="360">03 · 优化</text><text class="label" x="518" y="388">性能实验 · 安全调优</text><text class="sub" x="518" y="414">解释收益、成本与回归</text></g>
<g><rect class="card" x="730" y="333" width="230" height="108" rx="14"/><text class="lime" x="748" y="360">04 · 推理验证</text><text class="label" x="748" y="388">模型接入 · 服务就绪</text><text class="sub" x="748" y="414">容量、负载与端到端指标</text></g>
<rect class="boundary" x="40" y="462" width="920" height="49" rx="12"/><text class="tiny" x="60" y="492">明确边界：连接并协同核心引擎；不替代通用 IDE、模型训练平台或生产集群运维。</text>
</svg>
