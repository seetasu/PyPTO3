<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 365" role="img" aria-labelledby="t d">
<title id="t">PyPTO Pass 的六个职责阶段</title><desc id="d">依次规范控制流、提取 Scope、下沉 Tensor 到 Tile、适配设备、处理流水和缓冲、准备存储及运行时依赖。</desc>
<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#e8e8e8}.muted{fill:#aaa;font-size:12px}.head{font-size:14px;font-weight:700}.box{fill:#191919;stroke:#444}.num{font-size:11px;fill:#b1ef6b;font-family:monospace}.line{stroke:#555;stroke-width:2}</style></defs>
<rect width="1040" height="365" rx="12" fill="#111"/><text x="34" y="37" fill="#b1ef6b" font-size="11" letter-spacing="2">SIX RESPONSIBILITY GROUPS · NOT SIX LITERAL PASSES</text><path d="M96 127 H945" class="line"/>
<g><circle cx="97" cy="127" r="8" fill="#b1ef6b"/><circle cx="266" cy="127" r="8" fill="#bca0f3"/><circle cx="435" cy="127" r="8" fill="#79d4f2"/><circle cx="604" cy="127" r="8" fill="#f2c45f"/><circle cx="773" cy="127" r="8" fill="#bca0f3"/><circle cx="942" cy="127" r="8" fill="#79d4f2"/></g>
<g><rect class="box" x="34" y="157" width="126" height="145" rx="8"/><rect class="box" x="203" y="157" width="126" height="145" rx="8"/><rect class="box" x="372" y="157" width="126" height="145" rx="8"/><rect class="box" x="541" y="157" width="126" height="145" rx="8"/><rect class="box" x="710" y="157" width="126" height="145" rx="8"/><rect class="box" x="879" y="157" width="126" height="145" rx="8"/></g>
<g text-anchor="middle"><text class="num" x="97" y="185">01</text><text class="head" x="97" y="215">规范控制流</text><text class="muted" x="97" y="245">Inline · SSA</text><text class="muted" x="97" y="268">循环 / 分支</text><text class="num" x="266" y="185">02</text><text class="head" x="266" y="215">Scope 提取</text><text class="muted" x="266" y="245">图 · InCore</text><text class="muted" x="266" y="268">调用边界</text><text class="num" x="435" y="185">03</text><text class="head" x="435" y="215">Tensor → Tile</text><text class="muted" x="435" y="245">局部数据流</text><text class="muted" x="435" y="268">读 / 算 / 写</text><text class="num" x="604" y="185">04</text><text class="head" x="604" y="215">设备合法化</text><text class="muted" x="604" y="245">布局 · 内存</text><text class="muted" x="604" y="268">Kernel 拆分</text><text class="num" x="773" y="185">05</text><text class="head" x="773" y="215">流水与缓冲</text><text class="muted" x="773" y="245">loop · slot</text><text class="muted" x="773" y="268">同步顺序</text><text class="num" x="942" y="185">06</text><text class="head" x="942" y="215">存储 / Runtime</text><text class="muted" x="942" y="245">MemRef · 地址</text><text class="muted" x="942" y="268">Task · Scope</text></g>
