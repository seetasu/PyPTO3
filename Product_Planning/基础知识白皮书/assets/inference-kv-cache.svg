<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="t d">
<title id="t">KV Cache 复用上下文状态</title><desc id="d">生成的每一步追加新的状态，后续步骤复用先前 token 的 Key 和 Value，不必从头重新处理全部前缀。</desc>
<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#e8e8e8}.muted{fill:#aaa;font-size:12px}.head{font-size:14px;font-weight:700}.box{fill:#191919;stroke:#444}.green{fill:#b1ef6b}.blue{fill:#79d4f2}.amber{fill:#f2c45f}.arr{stroke:#777;stroke-width:2;fill:none}</style><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#777"/></marker></defs>
<rect width="1040" height="300" rx="12" fill="#111"/><text x="32" y="34" class="green" font-size="11" letter-spacing="2">REUSE PAST STATE · APPEND NEW STATE</text>
<text x="34" y="76" class="head">已有上下文</text><g><rect x="34" y="96" width="165" height="65" rx="7" fill="#162027" stroke="#45616a"/><rect x="210" y="96" width="165" height="65" rx="7" fill="#162027" stroke="#45616a"/><rect x="386" y="96" width="165" height="65" rx="7" fill="#162027" stroke="#45616a"/></g>
<text x="69" y="124" class="blue">token 1 状态</text><text x="68" y="146" class="muted">K / V</text><text x="245" y="124" class="blue">token 2 状态</text><text x="244" y="146" class="muted">K / V</text><text x="421" y="124" class="blue">token 3 状态</text><text x="420" y="146" class="muted">K / V</text>
<path d="M565 128 H629" class="arr" marker-end="url(#a)"/><rect x="645" y="96" width="162" height="65" rx="7" fill="#1d1d1d" stroke="#555"/><text x="673" y="124" class="head">复用旧状态</text><text x="675" y="146" class="muted">读取上下文</text><path d="M816 128 H877" class="arr" marker-end="url(#a)"/><rect x="892" y="96" width="120" height="65" rx="7" fill="#222017" stroke="#77643c"/><text x="916" y="124" class="amber">生成新 token</text><text x="929" y="146" class="muted">追加 K / V</text>
<path d="M952 169 V211 H115 V169" stroke="#75633b" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#a)"/><text x="34" y="247" class="muted">书本索引卡类比：保留查阅线索，后续读者复用；卡片占空间，且内容仍需被读取。</text><text x="34" y="270" fill="#777" font-size="11">示意图不表示某个引擎的精确缓存布局、字节数或单步算量。</text>
</svg>
