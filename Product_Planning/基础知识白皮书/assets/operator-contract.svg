<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#e8e8e8}.muted{fill:#aaa;font-size:12px}.head{font-size:14px;font-weight:700}.box{fill:#191919;stroke:#444}.green{fill:#b1ef6b}.blue{fill:#79d4f2}.amber{fill:#f2c45f}.violet{fill:#bca0f3}</style></defs>
