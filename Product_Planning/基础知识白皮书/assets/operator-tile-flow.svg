<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 335" role="img" aria-labelledby="t d">
<title id="t">长度 10 的向量按 Tile 处理</title><desc id="d">长度为十的数据使用四元素Tile分成三块，最后一块容量为四但只包含两个有效元素。</desc>
<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#e8e8e8}.muted{fill:#aaa;font-size:12px}.small{fill:#888;font-size:10px}.head{font-size:14px;font-weight:700}.slot{fill:#1b1b1b;stroke:#444}.valid{fill:#20301a;stroke:#668347}.invalid{fill:#25211a;stroke:#675a38}.green{fill:#b1ef6b}.amber{fill:#f2c45f}.blue{fill:#79d4f2}</style></defs>
<rect width="1040" height="335" rx="12" fill="#111"/><text x="32" y="35" class="green" font-size="11" letter-spacing="2">N = 10 · TILE CAPACITY = 4</text>
<text x="34" y="76" class="head">原始索引</text><g text-anchor="middle"><text x="127" y="76" class="small">0</text><text x="207" y="76" class="small">1</text><text x="287" y="76" class="small">2</text><text x="367" y="76" class="small">3</text><text x="447" y="76" class="small">4</text><text x="527" y="76" class="small">5</text><text x="607" y="76" class="small">6</text><text x="687" y="76" class="small">7</text><text x="767" y="76" class="small">8</text><text x="847" y="76" class="small">9</text></g>
<g><rect class="valid" x="90" y="89" width="72" height="45" rx="5"/><rect class="valid" x="170" y="89" width="72" height="45" rx="5"/><rect class="valid" x="250" y="89" width="72" height="45" rx="5"/><rect class="valid" x="330" y="89" width="72" height="45" rx="5"/><rect class="valid" x="410" y="89" width="72" height="45" rx="5"/><rect class="valid" x="490" y="89" width="72" height="45" rx="5"/><rect class="valid" x="570" y="89" width="72" height="45" rx="5"/><rect class="valid" x="650" y="89" width="72" height="45" rx="5"/><rect class="valid" x="730" y="89" width="72" height="45" rx="5"/><rect class="valid" x="810" y="89" width="72" height="45" rx="5"/></g>
<text x="34" y="176" class="head">Tile 切分</text>
<rect class="valid" x="90" y="151" width="312" height="55" rx="6"/><rect class="valid" x="410" y="151" width="312" height="55" rx="6"/><rect class="valid" x="730" y="151" width="152" height="55" rx="6"/><rect class="invalid" x="890" y="151" width="152" height="55" rx="6"/>
<text x="205" y="176" class="green">Tile 0 · [0,4)</text><text x="205" y="194" class="small">4 个有效元素</text><text x="525" y="176" class="green">Tile 1 · [4,8)</text><text x="525" y="194" class="small">4 个有效元素</text><text x="735" y="176" class="green">Tile 2 · [8,10)</text><text x="735" y="194" class="small">有效 2</text><text x="911" y="176" class="amber">物理尾位</text><text x="912" y="194" class="small">不得误读 / 写回</text>
<rect x="34" y="236" width="972" height="62" rx="7" fill="#171717" stroke="#333"/><text x="54" y="263" class="blue">案板类比：</text><text x="136" y="263" class="muted">四格餐盘装食材；最后一盘只有两份。盘子有四格，不代表四格都有真实数据。</text><text x="54" y="284" class="small">有效范围要同时约束 load、计算 mask 与 store。</text>
</svg>
