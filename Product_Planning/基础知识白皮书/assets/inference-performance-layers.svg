<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 295" role="img" aria-labelledby="t d">
<title id="t">端到端推理的四个归因层次</title><desc id="d">服务调度、Host编排、设备执行和模型策略共同构成请求耗时，须测量并定位关键路径。</desc>
<defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#e8e8e8}.muted{fill:#aaa;font-size:12px}.head{font-size:14px;font-weight:700}.box{fill:#191919;stroke:#444}.arr{stroke:#777;stroke-width:2;fill:none}.amber{fill:#f2c45f}.blue{fill:#79d4f2}.violet{fill:#bca0f3}.green{fill:#b1ef6b}</style><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#777"/></marker></defs>
<rect width="1040" height="295" rx="12" fill="#111"/><text x="32" y="34" class="green" font-size="11" letter-spacing="2">END-TO-END IS A SYSTEM PROPERTY</text>
<rect class="box" x="34" y="85" width="215" height="112" rx="9"/><rect class="box" x="292" y="85" width="215" height="112" rx="9"/><rect class="box" x="550" y="85" width="215" height="112" rx="9"/><rect class="box" x="808" y="85" width="198" height="112" rx="9"/>
<text x="54" y="117" class="amber head">服务层</text><text x="54" y="147" class="muted">排队 · 路由 · 批处理</text><text x="54" y="171" class="muted">请求负载与公平性</text><text x="312" y="117" class="blue head">Host 层</text><text x="312" y="147" class="muted">数据准备 · 提交</text><text x="312" y="171" class="muted">同步 · 拷贝</text><text x="570" y="117" class="violet head">设备层</text><text x="570" y="147" class="muted">Kernel · 访存 · 等待</text><text x="570" y="171" class="muted">并行与关键路径</text><text x="828" y="117" class="green head">模型层</text><text x="828" y="147" class="muted">长度 · 精度 · 缓存</text><text x="828" y="171" class="muted">算法与状态策略</text>
<path d="M253 141 H284 M511 141 H542 M769 141 H800" class="arr" marker-end="url(#a)"/>
<path d="M125 225 H915" stroke="#444" stroke-width="1"/><text x="158" y="256" class="muted">先量出各层所占时间 → 找到目标指标的关键路径 → 再选择优化动作</text><text x="32" y="280" fill="#777" font-size="11">类比配送：排队、拣货、装车、运输任何一段都可能决定收货时间。</text>
</svg>
